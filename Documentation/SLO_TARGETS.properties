#
# GMEPay+ declared service-level objectives — the OWNER's file.
#
# ============================================================================
#  EVERY VALUE BELOW IS DELIBERATELY EMPTY. THAT IS NOT AN OVERSIGHT.
# ============================================================================
#
# Gap register item T3-5 ("no SLA measurement, no load test, no capacity plan")
# splits into two halves that must not be confused:
#
#   * MEASUREMENT is an engineering problem, and it is now built. The load
#     harness (`gradlew :e2e-tests:loadTest`) measures end-to-end p50/p95/p99,
#     throughput, error rate by structured error code, and scrapes the
#     platform's own /actuator/prometheus for pool and JVM saturation.
#
#   * THE TARGETS ARE A BUSINESS DECISION. What latency and what availability
#     GMEPay+ *promises a partner* is a commercial commitment with contractual
#     and regulatory consequences. No test harness, and no engineer acting
#     alone, gets to choose it. The COO audit's finding (§8) was precisely that
#     "partner contracts will promise availability the platform cannot measure";
#     filling this file in with plausible-looking numbers would convert that
#     into the worse version — a contract that promises numbers nobody chose.
#
# So the harness reports NO_TARGETS_DECLARED — a third state that is neither a
# pass nor a failure — until a named human fills this in. Pinned by
# SloTargetsTest#shippedPlaceholderDeclaresNothing, so the emptiness cannot
# quietly rot into invented defaults.
#
# ---------------------------------------------------------------------------
# HOW TO DECLARE
# ---------------------------------------------------------------------------
# Uncomment a key and give it a value. Partially filled is a legitimate state:
# only keys with values are evaluated, and the report lists what is still
# undeclared. A key that is present but blank counts as undeclared, so an
# unfinished edit cannot fail a run.
#
# Before declaring anything, read Documentation/RUNBOOK_LOAD_AND_CAPACITY.md §6
# ("What an owner must decide") — several of these numbers are not meaningful
# until a prior question is answered (notably: does a *declined* payment count
# against availability?).
#
# ---------------------------------------------------------------------------
# WHO
# ---------------------------------------------------------------------------
# A number with no owner is not a commitment. Set both of these when you
# declare anything above zero targets; the harness prints
# "slo.owner NOT set — nobody owns these numbers" until you do.

#slo.owner=
#slo.reviewed-on=

# ---------------------------------------------------------------------------
# AVAILABILITY / RELIABILITY
# ---------------------------------------------------------------------------
# slo.availability.min-success-rate
#   Fraction (0..1) of attempted payments that must COMPLETE (HTTP 2xx).
#   NOTE: as measured, a structured decline (TRANSACTION_LIMIT_EXCEEDED,
#   SCHEME_CLOSED, MERCHANT_INACTIVE, …) does NOT count as a success, because
#   the payment did not complete — even though the platform behaved correctly.
#   Whether your availability SLO should exclude declines is an owner decision;
#   if it should, declare slo.reliability.max-error-rate instead and leave this
#   one undeclared.
#
# slo.reliability.max-error-rate
#   Fraction (0..1) of attempted payments that may fail for a platform reason
#   (5xx, timeout, connection failure, 429). Declines are excluded from this
#   number by construction.

#slo.availability.min-success-rate=
#slo.reliability.max-error-rate=

# ---------------------------------------------------------------------------
# LATENCY (end-to-end, milliseconds, as observed by the calling partner)
# ---------------------------------------------------------------------------
# Measured across the WHOLE scenario: for wallet-pay, one POST /v1/pay and the
# five services behind it; for authorize-confirm, quote + authorize + confirm
# summed. Per-step percentiles are reported separately but are not evaluated
# against targets — a partner experiences the total.
#
# Nearest-rank percentiles: a reported p99 is a latency some request really had,
# never an interpolated value.

#slo.latency.p50.max-ms=
#slo.latency.p95.max-ms=
#slo.latency.p99.max-ms=

# ---------------------------------------------------------------------------
# THROUGHPUT
# ---------------------------------------------------------------------------
# slo.throughput.min-tps
#   Minimum COMPLETED payments per second the run must achieve. Attempts that
#   the harness shed at its own concurrency cap are excluded, so this cannot be
#   satisfied by simply offering a higher rate.
#
#   Be careful declaring this from a local run: the whole fleet, the simulators
#   and the harness share one host's CPU and disk. See the runbook's "what this
#   does NOT cover".

#slo.throughput.min-tps=
