plugins {
    id 'java'
}

allprojects {
    group = 'com.gme.pay'
    version = '0.1.0'
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // ---------------------------------------------------------------------
    // Prometheus metrics registry — fleet-wide, in ONE place (gap T3-2).
    //
    // Until this block existed, `/actuator/prometheus` did NOT exist on any
    // service: api-gateway/build.gradle carried a comment claiming it and
    // api-gateway's SecurityConfig even permitted it anonymously, but no
    // module had a Micrometer registry on the classpath, so Boot never
    // registered the scrape endpoint (404 everywhere). Nothing could be
    // scraped, so nothing could be alerted on or measured for an SLA.
    //
    // Applied via `plugins.withId('org.springframework.boot')` so it lands on
    // exactly the 20 deployable services and NOT on the libs (which are
    // java-library modules with compileOnly Spring surfaces) or :e2e-tests.
    // Version is managed by the Boot BOM each service already applies via
    // io.spring.dependency-management — do not pin it here.
    //
    // Exposing the endpoint is the other half and is deliberately NOT done
    // per-service either: com.gme.pay.platform.MetricsExposureEnvironmentPostProcessor
    // in libs/lib-errors adds `prometheus` to
    // management.endpoints.web.exposure.include for every service. See
    // Documentation/RUNBOOK_MONITORING.md.
    plugins.withId('org.springframework.boot') {
        dependencies {
            implementation 'io.micrometer:micrometer-registry-prometheus'
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // Unit/slice tests: run everywhere (no Docker). Docker-backed Testcontainers ITs
    // must be annotated @Tag("docker"); the heavy fleet-booting end-to-end test is
    // @Tag("e2e"). Both are excluded from the default `test` task so `./gradlew build`
    // stays fast and self-contained. They run via the dedicated tasks below.
    test {
        useJUnitPlatform {
            excludeTags 'docker', 'e2e'
        }
    }

    tasks.register('integrationTest', Test) {
        description = 'Docker-backed integration tests (JUnit @Tag("docker")) — needs a Docker engine.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'docker'
        }
        shouldRunAfter tasks.named('test')
    }

    // Heavy black-box end-to-end tests (JUnit @Tag("e2e")) that boot the real money-path
    // fleet as detached JVMs. Excluded from the default `test` task; the :e2e-tests module
    // wires its fleet bootJar dependencies onto this task (see e2e-tests/build.gradle).
    tasks.register('e2eTest', Test) {
        description = 'Fleet-booting end-to-end tests (JUnit @Tag("e2e")) — no Docker required.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'e2e'
        }
        shouldRunAfter tasks.named('test')
    }

    // ---------------------------------------------------------------------
    // Cloud-agnostic portability guard (cloud/audit).
    //
    // GMEPay+ is deployable on AWS, Azure, or on-prem with NO code change — it
    // talks only open protocols (JDBC / Redis / Kafka / S3-API / OIDC / OTLP)
    // and every backing dependency is env-injected. This guard FAILS the build
    // if a cloud-provider SDK lands on any runtime classpath (directly or
    // transitively), so the provider-neutral property can never silently rot.
    //
    // Forbidden coordinates (group prefixes): AWS SDK v1/v2, Azure, GCP.
    // The S3-compatible vault uses io.minio (S3-API over HTTP) — NOT an SDK — so
    // it is deliberately not on this list.
    tasks.register('portabilityGuard') {
        description = 'Fails if a cloud-provider SDK (AWS/Azure/GCP) is on a runtime classpath.'
        group = 'verification'
        def forbidden = [
                'com.amazonaws',          // AWS SDK v1
                'software.amazon.awssdk', // AWS SDK v2
                'com.azure',              // Azure SDK
                'com.google.cloud',       // GCP SDK
        ]
        // Resolve only configurations that represent a deployable runtime classpath.
        def runtimeConfigNames = ['runtimeClasspath', 'productionRuntimeClasspath']
        doLast {
            def offenders = [] as Set
            configurations
                    .findAll { it.canBeResolved && runtimeConfigNames.contains(it.name) }
                    .each { cfg ->
                        cfg.resolvedConfiguration.lenientConfiguration.allModuleDependencies.each { dep ->
                            def coord = "${dep.moduleGroup}:${dep.moduleName}".toString()
                            if (forbidden.any { dep.moduleGroup?.startsWith(it) }) {
                                offenders << "${coord} (via ${cfg.name})".toString()
                            }
                        }
                    }
            if (!offenders.isEmpty()) {
                throw new GradleException(
                        "Cloud-provider SDK found on a runtime classpath of ':${project.name}' — " +
                        "this breaks cloud-agnostic portability (use only JDBC/Redis/Kafka/S3-API/OIDC/OTLP):\n  " +
                        offenders.join("\n  "))
            }
        }
    }

    // Wire into `check` so `./gradlew check` (and CI) catches future coupling.
    tasks.named('check').configure { dependsOn 'portabilityGuard' }
}
