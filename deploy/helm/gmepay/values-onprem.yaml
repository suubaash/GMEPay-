# ============================================================================
# OVERLAY: on-prem / self-hosted (in-cluster or external on-prem hosts).
# Backing stores run in the cluster (or on fixed on-prem hosts you name here).
# Object storage = MinIO (S3-compatible, path-style). OIDC = self-hosted Keycloak.
#
#   helm upgrade --install gmepay deploy/helm/gmepay \
#     -f deploy/helm/gmepay/values-onprem.yaml \
#     -f my-onprem-secrets.yaml          # private, NOT committed
#
# All endpoints below are in-cluster Service DNS placeholders — repoint at your
# real on-prem hosts (e.g. an external Postgres VM) as needed.
# ============================================================================

global:
  imageRegistry: registry.onprem.local/gmepay   # private on-prem registry (placeholder)
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent

abi:
  # REPLICA CEILING (2026-07-30): api-gateway's rate-limit window and replay nonce set live here.
  # A single self-hosted Redis pod is a single point of failure for the partner edge under the
  # default fail-closed replay posture; run Sentinel/HA, or accept the coupling knowingly, or set
  # gateway.rate-limit.on-store-error=local. ops-partner-bff uses it for paging dedupe only.
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  GMEPAY_SCHEMA_REGISTRY_URL: http://schema-registry:8081
  SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/merchant
  # MinIO — S3-compatible, PATH-STYLE addressing required.
  GMEPAY_VAULT_ENDPOINT: http://minio:9000
  GMEPAY_VAULT_REGION: us-east-1
  GMEPAY_VAULT_PATH_STYLE: "true"
  # Self-hosted Keycloak, realm `gmepay` (docker/keycloak/realm-gmepay.json).
  # ISSUER = the BROWSER-facing URL (what Keycloak stamps into `iss`); JWKS = the
  # in-cluster URL the pods fetch keys from. Using the in-cluster URL as the issuer
  # (as this file did) can never match a token the browser obtained through the
  # ingress -> every request 401'd. See docker/keycloak/README.md §1.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak.gmepay.local/realms/gmepay
  OIDC_ISSUER_URI: http://keycloak.gmepay.local/realms/gmepay
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/gmepay/protocol/openid-connect/certs
  # T3-2: the dead OTEL_EXPORTER_OTLP_ENDPOINT was removed from the base values and every overlay —
  # no service has an OTLP exporter and no collector is deployed. See Documentation/RUNBOOK_MONITORING.md.

# Credentials — PLACEHOLDERS. For real on-prem, prefer secrets.create=false and
# a sealed-secret / Vault-backed Secret named <release>-credentials.
secrets:
  create: true
  data:
    SPRING_DATASOURCE_USERNAME: gmepay
    SPRING_DATASOURCE_PASSWORD: REPLACE_WITH_ONPREM_PG_PASSWORD
    SPRING_DATA_REDIS_PASSWORD: ""
    GMEPAY_VAULT_ACCESS_KEY: gmepay
    GMEPAY_VAULT_SECRET_KEY: REPLACE_WITH_MINIO_SECRET
    GMEPAY_RBAC_SECRET: REPLACE_WITH_RBAC_SECRET
    GMEPAY_INTERNAL_AUTH_SECRET: REPLACE_WITH_INTERNAL_SECRET
    GMEPAY_WEBHOOK_SIGNING_SECRET: REPLACE_WITH_WEBHOOK_SECRET
    # T0-6: HS256 signing key for auth-identity's capability tokens. auth-identity refuses to start
    # on a placeholder — generate with `openssl rand -hex 32` and inject it here.
    GME_AUTH_JWT_SIGNING_SECRET: REPLACE_WITH_AUTH_JWT_SIGNING_SECRET
    # T0-6 rotation: previously active JWT keys, accepted for verification only while their tokens
    # expire — `<secret>@<ISO-8601 demoted-at>`, `;`-separated. EMPTY is the steady state; populate
    # it only for the duration of a rotation window, then empty it again.
    # A REPLACE_* placeholder would be REJECTED as key material, so this is empty by design.
    # Procedure: docs/runbooks/JWT_KEY_ROTATION.md
    GME_AUTH_JWT_PREVIOUS_KEYS: ""
    GMEPAY_SCHEME_NEPAL_TOKEN: REPLACE_FROM_SECRET_STORE
    GMEPAY_SCHEME_NEPAL_KEY: REPLACE_FROM_SECRET_STORE
    GMEPAY_SCHEME_NINEPAY_PRIVATE_KEY_PEM: REPLACE_FROM_SECRET_STORE
    GMEPAY_SCHEME_NINEPAY_PUBLIC_KEY_PEM: REPLACE_FROM_SECRET_STORE

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: api.gmepay.local
      paths: [{ path: /, pathType: Prefix, service: api-gateway, port: 8080 }]
    - host: admin.gmepay.local
      paths: [{ path: /, pathType: Prefix, service: admin-ui, port: 3000 }]
    - host: partner.gmepay.local
      paths: [{ path: /, pathType: Prefix, service: partner-portal-ui, port: 3001 }]

# 9Pay IPN edge (gap T5-7). OFF until 9Pay's IPN egress ranges are in hand — with
# enabled=true and an empty sourceRanges the template FAILS by design, because this
# allowlist is the only compensating control for T5-6 (9Pay does not sign the IPN
# `code` field, so a captured success IPN replays as a reversal and still verifies).
# sourceRanges is PARTNER DATA: get it from 9Pay in writing.
#
# On-prem there is usually a perimeter firewall in front of ingress-nginx as well.
# Restrict there TOO — nginx's whitelist-source-range is evaluated after the
# connection is accepted, and it reads the real client only if the controller sees it
# (use-forwarded-headers / a preserving L4 path). If the controller sits behind an
# L7 proxy that rewrites the peer, set
# services.scheme-adapter-ninepay.env.GMEPAY_SCHEME_NINEPAY_IPN_TRUSTED_PROXY_COUNT
# to the number of appending hops, or the service-level layer will compare the wrong
# address and deny everything.
ipnIngress:
  enabled: false
  controller: nginx
  className: nginx
  host: ipn.gmepay.local
  sourceRanges: []

# Per-service datasource URLs keep the in-cluster Postgres-per-service defaults
# from base values.yaml — nothing to override on-prem. Point them at external
# on-prem Postgres hosts here only if you do NOT run Postgres in-cluster, e.g.:
# services:
#   transaction-mgmt:
#     env:
#       SPRING_DATASOURCE_URL: jdbc:postgresql://pg-prod.onprem.local:5432/txndb
