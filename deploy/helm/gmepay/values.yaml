# ============================================================================
# GMEPay+ umbrella chart — BASE values (provider-neutral defaults).
#
# This file defines the SCHEMA and sane in-cluster defaults. A per-target
# overlay (values-onprem.yaml / values-aws.yaml / values-azure.yaml) overrides
# only the thin "where do the backing stores live" layer:
#   - global.imageRegistry / imageTag      (ECR / ACR / local registry)
#   - abi.*                                 (non-secret endpoints, regions, flags)
#   - secrets.data.*                        (credentials — PLACEHOLDERS only)
#   - services.<svc>.env.SPRING_DATASOURCE_URL   (DB-per-service connection URLs)
#   - ingress.hosts / className / annotations
#
# PORTABILITY RULE: every backing dependency is injected as ENV here, never
# baked into an image. The env-var NAMES below are the exact ones the services
# read (harvested from docker-compose.yml + each module's application.*).
# ============================================================================

global:
  # Image registry prefix used when a service.image is a bare repo (no "/").
  # Overlays point this at ECR / ACR / a private on-prem registry.
  imageRegistry: gmepay
  imageTag: dev
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []        # e.g. [{ name: ecr-pull }] / [{ name: acr-pull }]
  defaultPort: 8080
  defaultReplicas: 1
  # Spring actuator health path (only api-gateway + auth-identity ship actuator;
  # all other services use a tcp probe, set per-service below).
  healthPath: /actuator/health
  defaultResources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 640Mi

  # =========================================================================
  # Container hardening — gap T5-5 (CISO audit 2026-07-28 §14).
  #
  # Before this block the chart set NO securityContext at all, so every pod
  # inherited the image's user. 23 of the 24 images ran as root, which meant a
  # remote-code-execution in any service was root in its container, with the
  # full default capability set and a writable filesystem.
  #
  # The image side of the same fix is in every services/*/Dockerfile and
  # simulators/*/Dockerfile (UID 10001, numeric USER) plus apps/*/Dockerfile
  # (UID 1001). The two must stay in sync: if you change a Dockerfile's UID,
  # change runAsUser here, and vice versa.
  #
  # Overridable per service via services.<svc>.podSecurityContext /
  # .containerSecurityContext / .writablePaths — see templates/_deployment.tpl.
  # The three overlays (values-{aws,azure,onprem}.yaml) inherit all of this;
  # they intentionally override only registry/tag/endpoints.
  # =========================================================================
  podSecurityContext:
    # Refuse to start the pod at all if the image's user resolves to UID 0. This
    # is the assertion that keeps a future Dockerfile regression from silently
    # reintroducing root — hence the numeric USER in the Dockerfiles, which is
    # what lets the kubelet check this BEFORE the container runs.
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    # Group-own mounted volumes so the emptyDirs below are writable by the JVM.
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    # setuid/setgid/file-capability escalation off: the process cannot regain
    # privileges it was started without.
    allowPrivilegeEscalation: false
    privileged: false
    # No service needs to write to its own image. The paths that ARE written are
    # enumerated in writablePaths and mounted as emptyDir instead — leaving the
    # root filesystem writable everywhere to accommodate a handful of temp dirs
    # is what this deliberately avoids.
    readOnlyRootFilesystem: true
    capabilities:
      # Nothing here binds a privileged port (all listeners are >= 3000) or does
      # any raw-socket / chown / mknod work, so the entire default set goes.
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # Paths every container must still be able to write with a read-only root.
  # /tmp is java.io.tmpdir: embedded Tomcat's work directory lives there, and so
  # do scheme-adapter-zeropay's ${java.io.tmpdir}/gmepay/{inbound,outbound}
  # settlement-file staging dirs. Nothing in the fleet logs to a file (verified —
  # no FileAppender / logging.file.* anywhere), so no log volume is needed.
  writablePaths:
    - /tmp

# ---------------------------------------------------------------------------
# NON-SECRET portability ABI — rendered into one ConfigMap, mounted into EVERY
# pod via envFrom. Endpoints/regions/flags only; credentials go in `secrets`.
# Defaults below are in-cluster on-prem (self-hosted) service DNS names.
# ---------------------------------------------------------------------------
abi:
  # Redis (api-gateway reads SPRING_DATA_REDIS_*).
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  # Kafka (transaction-mgmt, revenue-ledger, notification-webhook).
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  GMEPAY_SCHEMA_REGISTRY_URL: http://schema-registry:8081
  # Mongo (merchant-qr-data).
  SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/merchant
  # Object store / partner vault (lib-vault binds gmepay.vault.* — relaxed
  # binding maps ACCESSKEY/SECRETKEY to accessKey/secretKey). REGION + PATH_STYLE
  # are part of the declared ABI; carried for forward-compat / S3 clients.
  GMEPAY_VAULT_ENDPOINT: http://minio:9000
  GMEPAY_VAULT_REGION: us-east-1
  GMEPAY_VAULT_PATH_STYLE: "true"
  # OIDC (api-gateway + ops-partner-bff resource servers). Provider-neutral var
  # name kept as an alias; the binding var is the Spring property name.
  #
  # T1-2: the ISSUER must be the BROWSER-facing URL, because that is what Keycloak
  # stamps into the token's `iss` and what the SPAs' NEXT_PUBLIC_KEYCLOAK_URL points
  # at. An in-cluster `http://keycloak:8080/...` issuer can never match a token a
  # browser obtained through the ingress, so every request 401'd. The JWKS URI stays
  # in-cluster — that is the URL the PODS fetch keys from; Spring still validates the
  # `iss` claim against issuer-uri when the decoder is built from jwk-set-uri.
  # Realm and client ids come from docker/keycloak/realm-gmepay.json (realm `gmepay`,
  # clients `admin-ui` / `partner-portal-ui`) — see docker/keycloak/README.md §1.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak.gmepay.local/realms/gmepay
  OIDC_ISSUER_URI: http://keycloak.gmepay.local/realms/gmepay
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/gmepay/protocol/openid-connect/certs
  # ---- Telemetry ----------------------------------------------------------
  # T3-2: OTEL_EXPORTER_OTLP_ENDPOINT used to be declared here (and in all three overlays) pointing at
  # an `otel-collector` that this chart does not deploy. It was DEAD CONFIG: no service has an
  # OpenTelemetry SDK / OTLP exporter / micrometer-tracing on its classpath, so nothing ever read the
  # variable, and the chart contains no collector Deployment. It has been REMOVED rather than wired,
  # because wiring it means adding a tracer to 20 services plus a collector — real work, not a config
  # line. Distributed tracing is an OPEN gap, stated honestly in Documentation/RUNBOOK_MONITORING.md.
  #
  # What DOES exist now: every service serves /actuator/prometheus (Micrometer registry on all 20
  # deployables), gated by the platform internal token. There is still no Prometheus/Grafana/Loki
  # deployed by this chart — scraping is the operator's, and the endpoints are the contract. Pod
  # annotations below advertise the target so a cluster-wide Prometheus can discover it.

# ---------------------------------------------------------------------------
# Monitoring (T3-2). This chart does NOT deploy Prometheus/Grafana/Alertmanager
# or any log aggregation — that remains an open part of T3-2. What it does is
# advertise every pod as a scrape target for an operator-supplied Prometheus.
# The scrape needs the platform internal token in the X-Gme-Internal header;
# Documentation/RUNBOOK_MONITORING.md carries the scrape_configs snippet.
# ---------------------------------------------------------------------------
monitoring:
  # Stamp prometheus.io/{scrape,path,port} onto every pod (kubernetes_sd convention).
  podAnnotations: true
  scrapePath: /actuator/prometheus

# ---------------------------------------------------------------------------
# SECRET portability ABI. `create: true` renders a chart-managed Secret from
# the PLACEHOLDER data below — fine for on-prem bootstrap, NOT for real prod.
# In prod set create:false and provision <release>-credentials out-of-band
# (External Secrets Operator / CSI / sealed-secrets) with the same keys.
# ---------------------------------------------------------------------------
secrets:
  create: true
  data:
    # Shared Postgres credential (DB-per-service, same role in self-host default).
    SPRING_DATASOURCE_USERNAME: gmepay
    SPRING_DATASOURCE_PASSWORD: CHANGE_ME_PG_PASSWORD
    # Redis (empty = no auth on self-host default).
    SPRING_DATA_REDIS_PASSWORD: ""
    # Object store keys (lib-vault gmepay.vault.accessKey/secretKey).
    GMEPAY_VAULT_ACCESS_KEY: gmepay
    GMEPAY_VAULT_SECRET_KEY: CHANGE_ME_VAULT_SECRET
    # Cross-service signing / internal-auth secrets (#90 RBAC + webhook).
    GMEPAY_RBAC_SECRET: CHANGE_ME_RBAC_EDGE_SECRET
    # GMEPAY_INTERNAL_AUTH_SECRET is now FAIL-CLOSED (T0-2 / T0-5), not best-effort:
    # auth-identity, prefunding, scheme-adapter-zeropay and rate-fx REFUSE TO START without it, and
    # any caller that omits it is answered 401 (never a bypass). It is surfaced to 11 services via
    # their envSecretKeys / envSecretAliases below — see the matrix in
    # outputs/agent/fix_fleet-config-convergence_2026-07-28.md. All 11 must receive the SAME value.
    # This placeholder is not a working credential; the cloud overlays point it at
    # Secrets Manager / Key Vault. Leaving it as-is means the whole fleet fails closed, by design.
    GMEPAY_INTERNAL_AUTH_SECRET: CHANGE_ME_INTERNAL_SVC_SECRET
    GMEPAY_WEBHOOK_SIGNING_SECRET: CHANGE_ME_WEBHOOK_SECRET
    # HS256 key for the platform capability tokens auth-identity mints (T0-6). Symmetric: whoever
    # holds it can forge any token. It used to be templated NOWHERE while auth-identity defaulted it
    # to a literal published in the repo; auth-identity now REFUSES TO START on a blank, too-short,
    # placeholder or previously-published value, so leaving this placeholder as-is fails the service
    # closed rather than signing forgeable tokens. Must be >= 32 chars of random material.
    GME_AUTH_JWT_SIGNING_SECRET: CHANGE_ME_AUTH_JWT_SIGNING_SECRET

# ---------------------------------------------------------------------------
# Ingress — fronts api-gateway + the two UIs. Hosts/class/annotations are
# overridden per target (nginx / ALB / App Gateway).
# ---------------------------------------------------------------------------
# NOTE (T1-2): Keycloak is NOT deployed by this chart — it is an external
# dependency. `keycloak.gmepay.local` (abi.OIDC_ISSUER_URI + the UIs'
# NEXT_PUBLIC_KEYCLOAK_URL) must resolve, from the BROWSER, to that external
# Keycloak's realm base; the pods reach the same realm in-cluster at
# http://keycloak:8080 for JWKS only. If you host Keycloak in-cluster, add a
# `keycloak` entry to the services map + an ingress host here and keep the two
# URLs pointing at the same realm.
ingress:
  enabled: true
  className: nginx
  annotations: {}
  tls: []
  hosts:
    - host: api.gmepay.local
      paths:
        - { path: /, pathType: Prefix, service: api-gateway, port: 8080 }
    - host: admin.gmepay.local
      paths:
        - { path: /, pathType: Prefix, service: admin-ui, port: 3000 }
    - host: partner.gmepay.local
      paths:
        - { path: /, pathType: Prefix, service: partner-portal-ui, port: 3001 }

# ===========================================================================
# SERVICES MAP — the single source of deployables. deployments.yaml ranges
# over this and renders one Deployment + Service per entry via _deployment.tpl.
#
# envSecretKeys: keys pulled from the credentials Secret as env (exact names).
# env:           literal per-service env (base URLs, datasource URL, flags).
#                SPRING_DATASOURCE_URL is per-service because GMEPay+ runs
#                DB-per-service (docs/INTER_SERVICE_CONTRACTS.md). Overlays
#                rewrite these URLs to point at RDS / Azure Flexible Server.
# probe.type:    http (actuator) for api-gateway/auth-identity; tcp elsewhere.
# ===========================================================================
services:

  config-registry:
    image: config-registry
    containerPort: 8080
    probe: { type: tcp }
    envSecretKeys: [SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
                    GMEPAY_VAULT_ACCESS_KEY, GMEPAY_VAULT_SECRET_KEY,
                    # T0-2: prefunding credit-limit push (/internal/v1/prefunding/**) is gated.
                    GMEPAY_INTERNAL_AUTH_SECRET]
    envSecretAliases:
      GMEPAY_AUTH_IDENTITY_INTERNAL_SECRET: GMEPAY_INTERNAL_AUTH_SECRET
    env:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-config:5432/configreg
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      # ---- Partner ACTIVATION must issue REAL credentials (gap T1-1) --------------
      # Both selectors default to `rest` in the image's application.properties; pinned
      # here too so the deployed wiring is auditable from the values file alone. With
      # `stub` (the pre-T1-1 implicit default) activation returns local randomness: the
      # API key resolves to found=false at auth-identity's
      # POST /internal/auth/keys/resolve and the whsec_ secret is unknown to
      # notification-webhook, so no partner request or webhook signature can verify.
      GMEPAY_AUTH_IDENTITY_CLIENT: "rest"
      GMEPAY_AUTH_IDENTITY_BASE_URL: http://auth-identity:8080
      GMEPAY_NOTIFICATION_WEBHOOK_CLIENT: "rest"
      GMEPAY_NOTIFICATION_WEBHOOK_BASE_URL: http://notification-webhook:8080

  rate-fx:
    image: rate-fx
    probe: { type: tcp }
    envSecretKeys: [
                    # REQUIRED TO BOOT (T0-2): POST /v1/rates/snapshots is gated, fail-closed.
                    GMEPAY_INTERNAL_AUTH_SECRET]
    env:
      SERVER_PORT: "8080"
      GMEPAY_CONFIG_REGISTRY_BASE_URL: http://config-registry:8080

  prefunding:
    image: prefunding
    probe: { type: tcp }
    envSecretKeys: [SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
                    # REQUIRED TO BOOT (T0-5): every prefunding route is gated, fail-closed.
                    GMEPAY_INTERNAL_AUTH_SECRET]
    env:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-prefunding:5432/prefunding
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver

  smart-router:
    image: smart-router
    probe: { type: tcp }
    env:
      SERVER_PORT: "8080"
      GMEPAY_CONFIG_REGISTRY_BASE_URL: http://config-registry:8080

  qr-service:
    image: qr-service
    probe: { type: tcp }
    envSecretKeys: [
                    # T0-2 outbound: the gated CPM prefunding reserve/release calls.
                    GMEPAY_INTERNAL_AUTH_SECRET]
    env:
      SERVER_PORT: "8080"
      GMEPAY_MERCHANT_QR_DATA_BASE_URL: http://merchant-qr-data:8080

  auth-identity:
    image: auth-identity
    probe: { type: http }     # ships spring-boot-starter-actuator
    envSecretKeys: [SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
                    GMEPAY_INTERNAL_AUTH_SECRET,
                    # REQUIRED TO BOOT (T0-6): the HS256 key for the platform capability tokens this
                    # service mints. No default exists in the image any more; a blank / placeholder /
                    # previously-published value stops the service starting.
                    GME_AUTH_JWT_SIGNING_SECRET]
    envSecretAliases:
      GMEPAY_RBAC_VERIFY_SECRET: GMEPAY_RBAC_SECRET
    env:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-authid:5432/authid
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      GME_CONFIG_REGISTRY_BASE_URL: http://config-registry:8080
      GMEPAY_RBAC_ENABLED: "true"
      GMEPAY_INTERNAL_AUTH_ENABLED: "true"

  transaction-mgmt:
    image: transaction-mgmt
    probe: { type: tcp }
    envSecretKeys: [SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
                    # T0-2: gates /actuator/metrics + /actuator/prometheus + /v3/api-docs;
                    # REQUIRED if devtools on.
                    GMEPAY_INTERNAL_AUTH_SECRET]
    env:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-txn:5432/txndb
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      # ---- Stuck / UNCERTAIN transaction alert sweep: ON (gap T3-3 / COO#4) -------
      # StuckTransactionAlertSweeper is one of only two production safety nets on the money path (the
      # other is payment-executor's DECLINE_SPIKE monitor). Its code default is still
      # `gmepay.txn.stuck-alert.enabled:false` -- transaction-mgmt was owned by another workstream when
      # T3-3 landed, so it is switched on HERE and in docker-compose.yml instead, which means every
      # SHIPPED deployment has it armed. Flipping the code default remains a one-line follow-up
      # (see Documentation/GAP_REGISTER.md T3-3).
      # It emits UNCERTAIN_AGED / STUCK_TXN ops.alert events via the outbox -> gmepay.ops.alert; the
      # operator recovery action is POST /v1/transactions/{txnRef}/resolve.
      GMEPAY_TXN_STUCK_ALERT_ENABLED: "true"
      # Sweep every 60s; WARN once a non-terminal row is 15min old, CRITICAL at 4x that (1h).
      GMEPAY_TXN_STUCK_ALERT_INTERVAL_MS: "60000"
      GMEPAY_TXN_STUCK_ALERT_THRESHOLD_SECONDS: "900"
      GMEPAY_TXN_STUCK_ALERT_CRITICAL_MULTIPLIER: "4"
      GMEPAY_TXN_STUCK_ALERT_STATUSES: "UNCERTAIN"

  payment-executor:
    image: payment-executor
    probe: { type: tcp }
    envSecretKeys: [SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
                    # T0-5/T0-2: gated prefunding debit + ZeroPay authorize/commit; also gates its own
                    # GET /v1/balance, GET /internal/ops/alerts and /actuator/prometheus.
                    GMEPAY_INTERNAL_AUTH_SECRET]
    env:
      SERVER_PORT: "8080"
      # FOUND WHILE CLOSING T3-3: this block had NO datasource at all, so a Helm-deployed
      # payment-executor fell back to the in-code H2 in-memory default and silently lost
      # execution_attempts / idempotency_keys / payment_authorizations on every restart — and would
      # have lost the new ops_alerts table too. docker-compose.yml has always set it; the chart did
      # not. Same DB the compose stack uses (postgres-executor / `executor`).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-executor:5432/executor
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      GMEPAY_CONFIG_REGISTRY_BASE_URL: http://config-registry:8080
      GMEPAY_RATE_FX_BASE_URL: http://rate-fx:8080
      GMEPAY_PREFUNDING_BASE_URL: http://prefunding:8080
      GMEPAY_MERCHANT_QR_DATA_BASE_URL: http://merchant-qr-data:8080
      GMEPAY_SCHEME_ADAPTER_ZEROPAY_BASE_URL: http://scheme-adapter-zeropay:8080
      GMEPAY_SCHEME_ADAPTERS_NEPAL_BASE_URL: http://scheme-adapter-nepal:8080
      GMEPAY_TRANSACTION_MGMT_BASE_URL: http://transaction-mgmt:8080
      GMEPAY_REVENUE_LEDGER_BASE_URL: http://revenue-ledger:8080
      # ---- Ops alert notification sink (gap T3-3) ----------------------------------
      # DECLINE_SPIKE is ON by default (application.properties) and every alert is persisted to
      # ops_alerts before publish, readable at GET /internal/ops/alerts (internal-token gated).
      # To PAGE A HUMAN, uncomment ONE line and give it your pager/Slack/Opsgenie webhook URL. It is
      # deliberately left unset: @ConditionalOnProperty matches an EMPTY value, so a blank URL would
      # activate the webhook sink with no target and fail every delivery. Unset => LogAlertSink.
      # There is no credential here — the token is inside the operator's URL.
      #   GMEPAY_ALERT_SINK_WEBHOOK_URL: https://hooks.slack.com/services/REPLACE/ME
      GMEPAY_ALERT_SINK_TIMEOUT_MS: "3000"
      GMEPAY_ALERT_SINK_MAX_ATTEMPTS: "3"

  merchant-qr-data:
    image: merchant-qr-data
    probe: { type: tcp }
    # T5-5: the ZeroPay merchant-feed sync works in a WORKDIR-relative directory
    # (gmepay.merchant-sync.inbound-dir=./data/zeropay-inbound => /app/data), so
    # readOnlyRootFilesystem needs that path mounted. An emptyDir is the safe
    # default; a real deployment should replace it with the shared inbound volume
    # the feed is actually delivered to.
    writablePaths:
      - /app/data
    env:
      SERVER_PORT: "8080"
      # Mongo URI comes from the shared ABI ConfigMap (SPRING_DATA_MONGODB_URI).

  scheme-adapter-zeropay:
    image: scheme-adapter-zeropay
    probe: { type: tcp }
    envSecretKeys: [SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
                    # REQUIRED TO BOOT (T0-2): /internal/scheme/zeropay/** is gated.
                    GMEPAY_INTERNAL_AUTH_SECRET]
    env:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-scheme:5432/zpadapter
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      GMEPAY_MERCHANT_QR_DATA_BASE_URL: http://merchant-qr-data:8080

  # Nepal corridor adapter (stateless). Ships to cloud; the sim-nepal-qr
  # simulator does NOT — override GMEPAY_SCHEME_NEPAL_BASE_URL per overlay to the
  # real Nepal partner (Khalti/Fonepay) endpoint. token/key belong in the Secret.
  scheme-adapter-nepal:
    image: scheme-adapter-nepal
    probe: { type: tcp }
    envSecretKeys: [GMEPAY_SCHEME_NEPAL_TOKEN, GMEPAY_SCHEME_NEPAL_KEY]
    env:
      SERVER_PORT: "8080"
      # REQUIRED override — no simulator in cloud; point at the live partner.
      GMEPAY_SCHEME_NEPAL_BASE_URL: https://REPLACE-with-nepal-partner-endpoint

  notification-webhook:
    image: notification-webhook
    probe: { type: tcp }
    envSecretKeys: [SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
                    GMEPAY_WEBHOOK_SIGNING_SECRET,
                    # T5-8: /v1/webhooks/endpoints/** mints and rotates whsec_ secrets — it must not
                    # be reachable by anything with in-cluster network access.
                    GMEPAY_INTERNAL_AUTH_SECRET]
    env:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notify:5432/notify
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      GMEPAY_WEBHOOK_DISPATCHER_ENABLED: "true"
      GMEPAY_INTERNAL_AUTH_ENABLED: "true"

  settlement-reconciliation:
    image: settlement-reconciliation
    probe: { type: tcp }
    envSecretKeys: [SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
                    # T0-2 outbound: the gated ZeroPay registration-status probe.
                    GMEPAY_INTERNAL_AUTH_SECRET]
    env:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-settlement:5432/settlement
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver

  revenue-ledger:
    image: revenue-ledger
    probe: { type: tcp }
    envSecretKeys: [SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD]
    env:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ledger:5432/ledger
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver

  reporting-compliance:
    image: reporting-compliance
    probe: { type: tcp }
    # T5-5: the only service that WRITES under its WORKDIR by default — the BOK
    # FX and KOFIU feed builders emit files to ./build/bok-out and ./build/kofiu-out
    # (=> /app/build). Mounted as an emptyDir so readOnlyRootFilesystem holds.
    # NOTE the operational consequence, which is not new but is now explicit: an
    # emptyDir dies with the pod, so a generated filing file is lost on restart.
    # That is acceptable only because the filing channels are not live (OI-02 /
    # OI-03 are externally gated); before real filing this must become a PVC.
    writablePaths:
      - /app/build
    env:
      SERVER_PORT: "8080"
      GMEPAY_REVENUE_LEDGER_BASE_URL: http://revenue-ledger:8080
      GMEPAY_TRANSACTION_MGMT_BASE_URL: http://transaction-mgmt:8080

  ops-partner-bff:
    image: ops-partner-bff
    probe: { type: tcp }
    envSecretKeys: [
                    # T0-5: the gated prefunding balance/alerts reads (RestPrefundingClient).
                    GMEPAY_INTERNAL_AUTH_SECRET]
    envSecretAliases:
      GMEPAY_AUTH_IDENTITY_INTERNAL_SECRET: GMEPAY_INTERNAL_AUTH_SECRET
    env:
      SERVER_PORT: "8080"
      # ---- Aggregate on-call paging (gap T3-3) -------------------------------------
      # The BFF already ships the platform's paging port (PagingPort + LogPagingAdapter fallback +
      # WebhookPagingAdapter). It consumes gmepay.ops.alert -- the consumer is
      # @ConditionalOnProperty("spring.kafka.bootstrap-servers"), which every pod gets from the shared
      # ABI ConfigMap, so it IS active here. Give it a target and alerts reach a human:
      #   GMEPAY_OPS_PAGING_WEBHOOK_URL: https://hooks.slack.com/services/REPLACE/ME
      # Left unset on purpose (an empty value would register the webhook adapter with no target).
      #
      # STILL OPEN (not fixable from a values file): the BFF's OpsAlertStore is an in-memory
      # ArrayDeque capped at gmepay.ops.alerts.capacity, so the aggregate view is still lost on
      # restart. payment-executor now persists what IT raises (ops_alerts, Flyway V006); giving the
      # BFF a durable store is the remaining half of T3-3. Escalation
      # (GMEPAY_OPS_PAGING_ESCALATION_ENABLED) stays off: it is documented single-replica-only, with
      # no ShedLock, so arming it under >1 replica would double-page.
      GMEPAY_CONFIG_REGISTRY_BASE_URL: http://config-registry:8080
      GMEPAY_TRANSACTION_MGMT_BASE_URL: http://transaction-mgmt:8080
      # Live partner transactions: activate the real REST transaction-mgmt client
      # (default is the in-memory stub). Portal then shows LIVE txns from transaction-mgmt.
      # Also selects the Portal CSV statement source — RestStatementClient builds the statement
      # from these same rows (gap T1-3) instead of 5 hardcoded TXN-100x samples.
      GMEPAY_TRANSACTION_MGMT_CLIENT: "rest"
      GMEPAY_PREFUNDING_BASE_URL: http://prefunding:8080
      # Live prefunding balances (gap T1-3). Without this the BFF fell back to StubPrefundingClient,
      # which only knows partner_test_001..003, so the Portal's Overview + Balance pages 404'd for
      # every REAL partner. RestPrefundingClient presents GMEPAY_INTERNAL_AUTH_SECRET (that balance
      # API is behind the internal-auth gate since T0-5) — already in envSecretKeys above.
      GMEPAY_PREFUNDING_CLIENT: "rest"
      GMEPAY_REVENUE_LEDGER_BASE_URL: http://revenue-ledger:8080
      # Live double-entry journals + revenue summary from revenue-ledger.
      GMEPAY_REVENUE_LEDGER_CLIENT: "rest"
      GMEPAY_SETTLEMENT_RECONCILIATION_BASE_URL: http://settlement-reconciliation:8080
      # Live settlements + recon-exception count + operator recon re-run.
      GMEPAY_SETTLEMENT_RECONCILIATION_CLIENT: "rest"
      # Real self-serve SANDBOX API keys via auth-identity (default is the
      # in-memory stub). Get-Started keys issued by POST /internal/auth/keys
      # (environment=SANDBOX). NOTE: also drives RestRbacAdminClient and, since gap
      # T1-3, RestApiKeyClient — the Portal's API Keys page reads the real api_keys
      # registry instead of two fabricated gpk_live_ credentials.
      GMEPAY_AUTH_IDENTITY_CLIENT: "rest"
      GMEPAY_AUTH_IDENTITY_BASE_URL: http://auth-identity:8080
      # Live partner webhook endpoints for the Portal's Webhooks page (gap T1-3): reads
      # notification-webhook GET /v1/webhook-configs?partnerId=. That page was previously two
      # partner.example.com rows hardcoded in PartnerPortalController with no client at all.
      GMEPAY_NOTIFICATION_WEBHOOK_BASE_URL: http://notification-webhook:8080
      GMEPAY_NOTIFICATION_WEBHOOK_CLIENT: "rest"
      # Live config-registry data (Platform Settings persistence + partner/scheme/audit reads).
      GMEPAY_CONFIG_REGISTRY_CLIENT: "rest"
      # Live kill-switch: pause/suspend must reach config-registry's /v1/ops gate
      # (enforced by payment-executor) — the stub only flips an in-memory flag.
      GMEPAY_OPS_CONTROL_CLIENT: "rest"

  api-gateway:
    image: api-gateway
    component: edge
    probe: { type: http }     # the one module with actuator + real /actuator/health
    # T0-7: GMEPAY_INTERNAL_AUTH_SECRET is now on the hot path for EVERY partner request — the
    # partner-credential lifecycle check calls auth-identity's POST /internal/auth/keys/resolve with
    # it. Without it that lookup can only 401, and the gateway answers partner traffic 503 rather
    # than skipping the check.
    envSecretKeys: [GMEPAY_INTERNAL_AUTH_SECRET, SPRING_DATA_REDIS_PASSWORD]
    envSecretAliases:
      GMEPAY_RBAC_STAMP_SECRET: GMEPAY_RBAC_SECRET
    env:
      SERVER_PORT: "8080"
      GMEPAY_RBAC_STAMP_ENABLED: "true"
      # T0-7: the partner IP allowlist must come from the real registry. The fallback
      # ConfigRegistryClient returns NOTHING (it used to seed the published test partner with
      # loopback/RFC1918 ranges), so without this every partner request is 403 IP_NOT_ALLOWED.
      GMEPAY_CONFIG_REGISTRY_CLIENT: "rest"
      # NOTE (T0-7): the gateway still authenticates nobody until an operator populates
      # gateway.partner-credentials.partners[] with each live partner's api-key + hmac-secret
      # (from a secret store) + ip-cidr-ranges. That table is intentionally NOT templated here:
      # per-partner HMAC secrets do not belong in a values file. See
      # services/api-gateway/.../partner/PartnerCredentialConfig.java for the checklist.
      GMEPAY_PAYMENT_EXECUTOR_BASE_URL: http://payment-executor:8080
      GMEPAY_AUTH_IDENTITY_BASE_URL: http://auth-identity:8080
      GMEPAY_CONFIG_REGISTRY_BASE_URL: http://config-registry:8080
      GMEPAY_RATE_FX_BASE_URL: http://rate-fx:8080
      GMEPAY_PREFUNDING_BASE_URL: http://prefunding:8080
      GMEPAY_TRANSACTION_MGMT_BASE_URL: http://transaction-mgmt:8080

  # ---- Human UIs (Next.js). NEXT_PUBLIC_* are read at runtime by npm start. ----
  # BFF_PROXY_TARGET is server-side only: the Next node process proxies /api/* to it
  # (next.config.mjs). NEXT_PUBLIC_BFF_BASE_URL is deliberately NOT set — it flips the
  # browser into direct cross-origin calls and the BFF ships no CORS config, so every
  # call would fail preflight (T1-2 task 4).
  # NEXT_PUBLIC_KEYCLOAK_URL must be the URL the BROWSER can reach (ingress host), and
  # must match abi.OIDC_ISSUER_URI above character-for-character.
  admin-ui:
    image: admin-ui
    component: ui
    containerPort: 3000
    probe: { type: tcp }
    # ---- T5-5 -------------------------------------------------------------
    # The two SPAs are node:20-alpine images running as nextjs:1001, NOT the JVM
    # images' 10001, so runAsUser/runAsGroup/fsGroup are overridden here. Only
    # these three keys are overridden; runAsNonRoot / allowPrivilegeEscalation /
    # readOnlyRootFilesystem / capabilities-drop / seccomp all still come from
    # global.*SecurityContext.
    podSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
    containerSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
    # `next start` writes the ISR / image-optimiser cache at runtime, so this one
    # subtree must be writable; the rest of the image stays read-only.
    writablePaths:
      - /app/.next/cache
    env:
      BFF_PROXY_TARGET: http://ops-partner-bff:8080
      NEXT_PUBLIC_KEYCLOAK_URL: http://keycloak.gmepay.local/realms/gmepay
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: admin-ui
      NEXT_PUBLIC_ALLOW_DEV_LOGIN: "false"

  partner-portal-ui:
    image: partner-portal-ui
    component: ui
    containerPort: 3001
    probe: { type: tcp }
    # T5-5 — same node:20-alpine / nextjs:1001 identity as admin-ui above. This
    # was the ONE image that already dropped root before this change; the chart
    # still has to state the UID explicitly, because its Dockerfile uses a NAMED
    # `USER nextjs` which the kubelet cannot resolve to check runAsNonRoot.
    podSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
    containerSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
    writablePaths:
      - /app/.next/cache
    env:
      BFF_PROXY_TARGET: http://ops-partner-bff:8080
      NEXT_PUBLIC_KEYCLOAK_URL: http://keycloak.gmepay.local/realms/gmepay
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: partner-portal-ui
      NEXT_PUBLIC_ALLOW_DEV_LOGIN: "false"
