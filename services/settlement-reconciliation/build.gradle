// settlement-reconciliation service: net/gross settlement, ZP file recon, invoicing (WBS 7.1, 7.4, 7.6, 9.8)
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Actuator (feat/actuator-health): /actuator/health + liveness/readiness probes + /actuator/metrics.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10.x ships PostgreSQL support as a separate module (needed by the postgres:16
    // Testcontainers ITs + production; flyway-core alone throws "Unsupported Database: PostgreSQL 16").
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    implementation project(':libs:lib-money')
    implementation project(':libs:lib-errors')
    implementation project(':libs:lib-events')
    // Outbound settlement.completed event transport (Kafka when spring.kafka.bootstrap-servers is set,
    // LoggingEventPublisher fallback otherwise — see com.gme.pay.settlement.outbox.OutboxConfig).
    implementation project(':libs:lib-events-kafka')
    // PartnerView DTO for the config-registry partner-config client (per-partner rounding mode).
    implementation project(':libs:lib-api-contracts')

    // T3-11: distributed scheduler locking. Seven @Scheduled jobs run on every instance, and three of
    // them GENERATE AND TRANSMIT SETTLEMENT FILES to a scheme. A second replica means the scheme
    // receives the same settlement instruction twice. Version matches prefunding (5.16.0), the
    // service that already had this working -- see com.gme.pay.settlement.config.ShedLockConfig.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.16.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 17.2-G07: Docker-backed PostgreSQL 16 ITs (@Tag("docker")). Excluded from the
    // local `test` task by the root build; CI runs them via `integrationTest`.
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.1')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

// Pin Testcontainers to the BOM version above (Spring Boot's dependency management
// would otherwise downgrade it to its own default).
ext['testcontainers.version'] = '1.20.1'
