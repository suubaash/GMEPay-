spring.application.name=ops-partner-bff
server.port=8095

# Pass the human-readable reason through to the Admin UI / Partner Portal so a
# 409 / 404 surfaces "partner '...' already exists" instead of the bare error
# code. Required so RestConfigRegistryClient can forward upstream messages.
server.error.include-message=always

# ---------------------------------------------------------------------------
# Identity boundary (gap register T0-1/T0-2) — OAuth2 resource server.
# Every request except /actuator/health** must carry a valid bearer JWT from this
# issuer; see config/BffSecurityConfig.java. Provider-neutral and IDENTICAL in style
# to services/api-gateway/src/main/resources/application.yml (ADR-011), so one IdP
# configuration serves both:
#   OIDC_ISSUER_URI  — preferred env name; works for self-hosted Keycloak or any
#                      cloud IdP. The default below targets the docker-compose
#                      Keycloak (realm = gmepay) for LOCAL DEV ONLY.
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI — also honoured (Spring
#                      relaxed binding) and takes precedence if both are set.
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI — set only when the IdP's
#                      OIDC discovery (.well-known) is unreachable and JWKS must be pinned.
# The decoder is created lazily, so a wrong/unreachable issuer fails the REQUEST
# (401), not startup.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8090/realms/gmepay}

# Authorization source: the token's claims (NOT the X-Gme-* request headers, which are
# only trustworthy behind an edge that stamps + HMAC-signs them). The IdP must emit:
#   permissions  — array (or comma-separated string) of permission codes, e.g.
#                  ["partner.view","partner.activate","txn.view","ops:operate"]
#   partner_id   — the partner a PARTNER-portal token is scoped to (omit for hub
#                  operators; tenant_id / partnerId are accepted as fallbacks)
#   realm_access.roles — Keycloak realm roles, mapped to ROLE_* as in api-gateway
# See security/TokenClaims.java. A token with no permissions claim authenticates but
# authorizes nothing (fail closed).

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
# NOTE: now behind authentication (the SecurityFilterChain permits only /actuator/health**),
# so the internal API surface is no longer published to anonymous callers.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# Upstream backend service base URLs. Read by Rest*Client adapters via @Value.
# In Phase 1 the @Primary stub clients are wired by default; once Rest* adapters
# are activated they take precedence and call these URLs.
gmepay.config-registry.base-url=http://config-registry:8080
gmepay.transaction-mgmt.base-url=http://transaction-mgmt:8080
gmepay.prefunding.base-url=http://prefunding:8080
gmepay.revenue-ledger.base-url=http://revenue-ledger:8080
gmepay.settlement-reconciliation.base-url=http://settlement-reconciliation:8080
gmepay.reporting-compliance.base-url=http://reporting-compliance:8080
gmepay.auth-identity.base-url=http://auth-identity:8080
gmepay.notification-webhook.base-url=http://notification-webhook:8080
# Internal service-to-service token (#90). auth-identity's /v1/rbac/**, /v1/approvals/** and
# /internal/auth/keys are internal-only; auth-identity now ENFORCES the internal-auth gate (T0-2,
# and it refuses to boot without a secret), so the BFF presents this shared secret in the
# X-Gme-Internal header on every call. Blank = no header sent ⇒ 401 (fail-closed), never a bypass.
gmepay.auth-identity.internal-secret=${GMEPAY_INTERNAL_AUTH_SECRET:}
# Same platform secret, under the platform-wide key name, for the NON-auth-identity gated peers the
# BFF calls: prefunding's whole balance API (/v1/prefunding/**) is behind the gate since T0-5, so
# RestPrefundingClient must present the token or the ops partner-balance panel 401s. Kept as a
# separate property from the auth-identity one above so a deployment could rotate them
# independently; both default to the one GMEPAY_INTERNAL_AUTH_SECRET the platform shares today.
gmepay.internal-auth.secret=${GMEPAY_INTERNAL_AUTH_SECRET:}

# Client selector per upstream: 'stub' (default, in-memory) or 'rest' (live HTTP).
# Mirrors gmepay.config-registry.client. The Stub* and Rest* beans are mutually
# exclusive via @ConditionalOnProperty so exactly one is wired. Override per
# environment, e.g. GMEPAY_TRANSACTION_MGMT_CLIENT=rest, once the upstream is up.
# transaction-mgmt GET /v1/transactions{,/search,/{ref}}. ALSO selects the Partner Portal's CSV
# statement source (RestStatementClient builds the statement from these same rows — gap T1-3), so
# 'rest' means both the Transactions page and the statement download are real; 'stub' means the
# statement is a header-only CSV rather than five fabricated TXN-100x rows.
gmepay.transaction-mgmt.client=${GMEPAY_TRANSACTION_MGMT_CLIENT:stub}
gmepay.settlement-reconciliation.client=${GMEPAY_SETTLEMENT_RECONCILIATION_CLIENT:stub}
# prefunding GET /v1/prefunding/{partnerCode}/{balance,alerts} — the Portal's Overview + Balance
# pages and the ops partner-balance panel. Was NEVER declared here and never set on any deploy
# target (gap T1-3), so StubPrefundingClient answered in production: real partners (GMEREMIT,
# SENDMN) 404'd and only partner_test_001..003 had a balance. Every deploy target now sets rest.
# RestPrefundingClient presents the internal-auth token (prefunding's balance API is gated, T0-5).
gmepay.prefunding.client=${GMEPAY_PREFUNDING_CLIENT:stub}
# notification-webhook GET /v1/webhook-configs?partnerId= — the Portal's Webhooks page
# (RestPortalWebhookClient). Before gap T1-3 that page was two partner.example.com rows hardcoded
# in PartnerPortalController with no client at all. Distinct from gmepay.webhook-ops.client below,
# which is the OPERATOR view of the same service (delivery backlog + replay).
gmepay.notification-webhook.client=${GMEPAY_NOTIFICATION_WEBHOOK_CLIENT:stub}
# reporting-compliance GET /v1/reports (BOK FX1014/FX1015). StubReportingClient by default;
# set GMEPAY_REPORTING_COMPLIANCE_CLIENT=rest to call the live service.
gmepay.reporting-compliance.client=${GMEPAY_REPORTING_COMPLIANCE_CLIENT:stub}
# auth-identity selector — drives THREE adapters, since auth-identity owns both RBAC and key
# lifecycle (ADR-011):
#   RestRbacAdminClient  -> /v1/rbac/* (RBAC management: roles/permissions) for the admin-ui page
#   RestSandboxKeyClient -> /internal/auth/keys (self-serve SANDBOX issuance, Get-Started)
#   RestApiKeyClient     -> GET /internal/auth/keys?partnerId=&environment= (the Portal's API Keys
#                           page). Added for gap T1-3; before it, no rest client existed and the
#                           page could only render StubApiKeyClient's two fabricated gpk_live_ keys.
# 'stub' means the API Keys page honestly reports NO keys rather than inventing credentials.
gmepay.auth-identity.client=${GMEPAY_AUTH_IDENTITY_CLIENT:stub}
# revenue-ledger GET /v1/revenue (per-partner FX-margin + service-charge aggregate).
# StubRevenueLedgerClient by default; set GMEPAY_REVENUE_LEDGER_CLIENT=rest to call
# the live service via RestRevenueLedgerClient. NOTE: upstream is per-(numeric)partnerId
# only — to back the SYSTEM-WIDE dashboard summary the rest client queries ONE configured
# partner (gmepay.revenue-ledger.aggregate-partner-id). Unset -> honest zero summary +
# empty breakdown (no synthetic data). A true system-wide / multi-axis endpoint and a
# partner code->id map are outstanding upstream asks (see build report INTEGRATION REQUESTS).
gmepay.revenue-ledger.client=${GMEPAY_REVENUE_LEDGER_CLIENT:stub}
gmepay.revenue-ledger.aggregate-partner-id=${GMEPAY_REVENUE_AGGREGATE_PARTNER_ID:}
# system-health aggregator: fans out to each backend's /actuator/health.
# StubSystemHealthClient by default (all UP); set GMEPAY_SYSTEM_HEALTH_CLIENT=rest
# for the live RestSystemHealthClient probe fan-out.
gmepay.system-health.client=${GMEPAY_SYSTEM_HEALTH_CLIENT:stub}
# Ops wave (control-tower + audited operator actions). Each defaults to the in-memory
# stub so the BFF boots + control-tower composes standalone; set the matching env var
# to 'rest' to call the live upstream once it is up.
#  - ops-control        -> config-registry GET /v1/ops/operational-status + POST /v1/ops/{pause,resume,maintenance,suspend,unsuspend}
#  - webhook-ops        -> notification-webhook GET /v1/webhooks/deliveries/backlog + POST /v1/webhooks/deliveries/{id}/replay
#                          AND (T5-8) GET /v1/webhooks/endpoints/signing-health + POST
#                          /v1/webhooks/endpoints/{id}/rotate-secret, i.e. the ONLY way an
#                          operator can see which partner webhook endpoints stopped signing
#                          after T5-4 and rotate one back to life. Left on 'stub' the Admin UI
#                          webhook-secret panel reports no endpoints and rotation returns 503 —
#                          it never fabricates a secret. Every deploy target must set 'rest'.
#                          RestWebhookOpsClient presents gmepay.internal-auth.secret in the
#                          X-Gme-Internal header, because that provisioning surface mints and
#                          reveals whsec_ plaintext and is internal-only.
#  - operator-action-audit -> auth-identity POST /v1/audit/operator-actions (who/what/when/reason)
gmepay.ops-control.client=${GMEPAY_OPS_CONTROL_CLIENT:stub}
gmepay.webhook-ops.client=${GMEPAY_WEBHOOK_OPS_CLIENT:stub}
gmepay.operator-action-audit.client=${GMEPAY_OPERATOR_ACTION_AUDIT_CLIENT:stub}

# Slice 3 (3A.1) — KYB document upload relay (ADR-006). Spring Boot's default
# multipart cap is 1MB; license/AoA scans routinely exceed that. 25MB matches
# config-registry's limit so the BFF never accepts what upstream would reject.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Redis is on the classpath ONLY for the shared paging-dedupe cooldown, and that cooldown fails
# over to a per-JVM one rather than suppressing pages (FailoverPagingCooldown). So a Redis outage
# must NOT contribute DOWN to this service's health: the readiness probe reads /actuator/health,
# and marking every BFF replica unready over an unavailable dedupe cache would take the admin UI
# and the partner portal down to protect a noise-reduction feature. Explicitly off, not defaulted.
management.health.redis.enabled=false

# --- Ops paging dedupe cooldown (replica ceiling) ------------------------------------------
# The (alertType|subjectRef) cooldown that stops a re-firing sweep from storming the pager. It was
# a per-JVM ConcurrentHashMap, so at N>1 replicas the escalation sweep -- which runs on every
# replica by design -- paged a human once per replica.
#   auto (default) → redis when spring.data.redis.host is set, per-JVM otherwise
#   redis          → redis, REFUSE TO START without a host
#   memory         → per-JVM (dedupe is per-replica)
# An unreachable Redis degrades to the per-JVM cooldown; it never suppresses a page. That is the
# OPPOSITE of the api-gateway's fail-closed posture and it is deliberate -- see
# FailoverPagingCooldown: this control authorises nothing, so its failure must be noisier, not
# quieter. A missed page during an incident is not recoverable; a duplicate page is.
gmepay.ops.paging.cooldown-store=auto
