# kyb-adapter service configuration (ADR-009 / ADR-014).
# SERVER_PORT is honoured (compose and the Helm chart both set 8080; run-fleet.ps1
# uses 18098); 8098 stays the bare local default.
server.port=${SERVER_PORT:8098}

# ---------------------------------------------------------------------------
# Adapter-side persistence (Slice 3): the kyb_screening run log. H2 by default
# so unit slices / local dev need no Docker; production overrides via env to
# PostgreSQL. Flyway owns the schema (ddl-auto=none). This is the adapter's own
# record of every verification run — distinct from config-registry's partner_kyb.
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:kyb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true

# Business-registration verifier (KFTC 사업자등록 진위확인 rail). 'stub'
# (deterministic in-process default, until the KFTC production certificate is
# provisioned) or 'kftc' (KftcBusinessRegistrationVerifier — fails fast per the
# same gating as config-registry's KftcVerificationAdapter).
gmepay.kyb.biz-reg.provider=${GMEPAY_KYB_BIZREG_PROVIDER:stub}

# Active KYB provider: 'stub' (deterministic StubKybAdapter, the default until
# Octa Solution sandbox credentials land) or 'octa' (OctaKybAdapter — requires
# gmepay.kyb.octa.base-url + gmepay.kyb.octa.api-key; currently fails fast per
# ADR-014).
#
# T1-4 HONESTY NOTE: with 'stub' this service SCREENS NOTHING. StubKybAdapter
# keyword-matches the subject's own names; no sanctions, PEP or adverse-media
# source is consulted. Its verdicts therefore carry non-authoritative provenance,
# its clean branch records NOT_SCREENED_NO_PROVIDER (never CLEAR), and a full
# verification can only reach MANUAL_REVIEW — never PASS. GET /v1/kyb/health
# reports authoritative=false with the caveat so a mis-wired environment is
# visible without reading code.
gmepay.kyb.provider=${GMEPAY_KYB_PROVIDER:stub}

# ---------------------------------------------------------------------------
# service-to-service internal-auth gate (T0-2 mechanism, wired here for T1-4)
# ---------------------------------------------------------------------------
# /v1/kyb/screen and /v1/kyb/verify take a partner's legal names, tax id and the
# full UBO set (names + PEP flags) and return a compliance verdict that the
# onboarding wizard stores as regulator-facing evidence; /v1/kyb/result/{ref}
# reads any stored run back. There is no api-gateway route to this service and
# the only legitimate caller is config-registry, so the whole surface is
# internal-only and now requires the shared X-Gme-Internal token.
#
# enabled is pinned true (KybInternalAuthEnforcedConfig refuses to start if the
# gate is not actually armed) and the secret has NO in-repo default: a blank
# GMEPAY_INTERNAL_AUTH_SECRET fails the service closed at startup rather than
# serving KYB subjects anonymously. GET /v1/kyb/health stays anonymous so a
# container/probe can reach it (it exposes no partner data).
gmepay.internal-auth.enabled=true
gmepay.internal-auth.secret=${GMEPAY_INTERNAL_AUTH_SECRET:}
gmepay.internal-auth.path-patterns=/v1/kyb/screen,/v1/kyb/verify,/v1/kyb/result/**,/v1/screening/**,/actuator/metrics/**,/actuator/prometheus,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# ---------------------------------------------------------------------------
# TRANSACTION screening on the payment path (gap T5-3)
# ---------------------------------------------------------------------------
# READ THIS BEFORE ASSUMING ANY AML CONTROL EXISTS.
#
# There is NO transaction-level sanctions/PEP screening on this platform. Nothing
# checks a payer, a beneficiary or a merchant against any sanctions list, PEP
# register or adverse-media source. The properties below configure the SEAM where
# such a check would go, and the honest accounting of its emptiness — they do not
# constitute a control and must not be described as one.
#
# Note also that the "AML gates" elsewhere in the platform are NOT screening: the
# per-txn USD min/max, daily/monthly/annual USD caps and the daily transaction
# count cap are numeric comparisons against operator-entered limits under the
# 소액해외송금업 licence. They screen nobody.
#
# WHAT EXISTS: POST /v1/screening/transaction asks the PaymentScreeningPort about
# each party, records the outcome per (txn_ref, party) in transaction_screening
# (V004), seals it in the hash-chained audit_log (V003) under an attested actor,
# and reports allow/refuse. Coverage is queryable at GET /v1/screening/coverage
# and the posture at GET /v1/screening/posture — both always return WHICH provider
# answered, so a zero unscreened-count cannot be misread as full coverage.
#
# NOT YET WIRED: payment-executor does not call this endpoint. Nothing on the live
# money path is screened today. See outputs/agent/fix_t5-aml-screening_2026-07-28.md.
#
# INTEGRATING A REAL PROVIDER is one bean: a PaymentScreeningPort that calls the
# vendor and stamps ScreeningProvenance.vendor(id). TransactionScreeningConfig's
# @ConditionalOnMissingBean default steps aside; no policy, table, migration, audit
# verb or query surface changes. Note the half of the gap no vendor purchase fixes:
# neither payment contract carries an originator NAME (API-05 authorize has
# customer_ref, the wallet has userRef — both opaque), so a name-matching provider
# would still screen nobody until those contracts carry a screenable identity. That
# is counted separately as NO_SUBJECT_IDENTITY.

# WHICH PARTIES MUST BE SCREENED. Comma-separated: PAYER, BENEFICIARY, MERCHANT.
#
# EMPTY BY DEFAULT, AND THAT IS THE SHIPPED STATE. Empty means no party is required,
# which means no payment is ever refused for want of a screening and the payment
# path behaves exactly as it did before this seam existed. Outcomes are still
# recorded and audited — the absence reports itself rather than being invisible.
#
# POPULATING THIS IS A COMPLIANCE DECISION WITH A REVENUE CONSEQUENCE, not a
# hardening step. The posture below is fail-CLOSED, so with no authoritative
# provider wired (the current state) naming a party here refuses EVERY payment
# involving it. Naming PAYER is stronger still: the payment contracts carry no
# originator name, so a payer requirement refuses every payment even after a vendor
# is bought. An unrecognised value fails startup rather than silently requiring
# nobody.
gmepay.screening.transaction.required-parties=

# FAIL-OPEN OVERRIDE — proceed when a REQUIRED screening cannot be performed.
#
# Default false, i.e. fail CLOSED: a required check that did not happen is a
# refusal. That is not a configurable opinion in production — the service REFUSES
# TO START if this is true in a production (or unlabelled) environment, rather than
# starting and quietly permitting. It exists for sandboxes that must exercise the
# code path with no vendor wired. Every payment that proceeds under it writes a
# TRANSACTION_SCREENING_OVERRIDDEN audit row; it never looks like a clean pass.
#
# Note this flag is inert while required-parties is empty: with nothing required
# there is no unavailable-branch to override.
gmepay.screening.transaction.allow-unavailable-override=false

# Deployment environment name, used only to refuse the override above outside a
# recognised non-production environment (local, dev, development, test, ci,
# sandbox, uat, staging, stage). Anything else — including BLANK and anything
# unrecognised — is treated as PRODUCTION: a deployment that failed to say what it
# is does not get the benefit of the doubt.
gmepay.environment=${GMEPAY_ENVIRONMENT:${spring.profiles.active:}}

# Octa Solution connection (only read when gmepay.kyb.provider=octa).
# Production injects these via environment (GMEPAY_KYB_OCTA_BASE_URL / _API_KEY).
#gmepay.kyb.octa.base-url=
#gmepay.kyb.octa.api-key=

# Kafka fan-out of screening results to gmepay.kyb.screening. The
# KafkaEventPublisher auto-config (lib-events-kafka) only activates when
# spring.kafka.bootstrap-servers is set; without it the LogEventPublisher
# fallback records each event at INFO. Compose/production set
# SPRING_KAFKA_BOOTSTRAP_SERVERS.
#spring.kafka.bootstrap-servers=

# Surface the human-readable reason on ResponseStatusException so callers
# (config-registry's RestKybClient) can relay meaningful error messages.
server.error.include-message=always
