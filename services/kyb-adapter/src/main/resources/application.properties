# kyb-adapter service configuration (ADR-009 / ADR-014).
# SERVER_PORT is honoured (compose and the Helm chart both set 8080; run-fleet.ps1
# uses 18098); 8098 stays the bare local default.
server.port=${SERVER_PORT:8098}

# ---------------------------------------------------------------------------
# Adapter-side persistence (Slice 3): the kyb_screening run log. H2 by default
# so unit slices / local dev need no Docker; production overrides via env to
# PostgreSQL. Flyway owns the schema (ddl-auto=none). This is the adapter's own
# record of every verification run — distinct from config-registry's partner_kyb.
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:kyb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true

# Business-registration verifier (KFTC 사업자등록 진위확인 rail). 'stub'
# (deterministic in-process default, until the KFTC production certificate is
# provisioned) or 'kftc' (KftcBusinessRegistrationVerifier — fails fast per the
# same gating as config-registry's KftcVerificationAdapter).
gmepay.kyb.biz-reg.provider=${GMEPAY_KYB_BIZREG_PROVIDER:stub}

# Active KYB provider: 'stub' (deterministic StubKybAdapter, the default until
# Octa Solution sandbox credentials land) or 'octa' (OctaKybAdapter — requires
# gmepay.kyb.octa.base-url + gmepay.kyb.octa.api-key; currently fails fast per
# ADR-014).
#
# T1-4 HONESTY NOTE: with 'stub' this service SCREENS NOTHING. StubKybAdapter
# keyword-matches the subject's own names; no sanctions, PEP or adverse-media
# source is consulted. Its verdicts therefore carry non-authoritative provenance,
# its clean branch records NOT_SCREENED_NO_PROVIDER (never CLEAR), and a full
# verification can only reach MANUAL_REVIEW — never PASS. GET /v1/kyb/health
# reports authoritative=false with the caveat so a mis-wired environment is
# visible without reading code.
gmepay.kyb.provider=${GMEPAY_KYB_PROVIDER:stub}

# ---------------------------------------------------------------------------
# service-to-service internal-auth gate (T0-2 mechanism, wired here for T1-4)
# ---------------------------------------------------------------------------
# /v1/kyb/screen and /v1/kyb/verify take a partner's legal names, tax id and the
# full UBO set (names + PEP flags) and return a compliance verdict that the
# onboarding wizard stores as regulator-facing evidence; /v1/kyb/result/{ref}
# reads any stored run back. There is no api-gateway route to this service and
# the only legitimate caller is config-registry, so the whole surface is
# internal-only and now requires the shared X-Gme-Internal token.
#
# enabled is pinned true (KybInternalAuthEnforcedConfig refuses to start if the
# gate is not actually armed) and the secret has NO in-repo default: a blank
# GMEPAY_INTERNAL_AUTH_SECRET fails the service closed at startup rather than
# serving KYB subjects anonymously. GET /v1/kyb/health stays anonymous so a
# container/probe can reach it (it exposes no partner data).
gmepay.internal-auth.enabled=true
gmepay.internal-auth.secret=${GMEPAY_INTERNAL_AUTH_SECRET:}
gmepay.internal-auth.path-patterns=/v1/kyb/screen,/v1/kyb/verify,/v1/kyb/result/**,/actuator/metrics/**,/actuator/prometheus,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# Octa Solution connection (only read when gmepay.kyb.provider=octa).
# Production injects these via environment (GMEPAY_KYB_OCTA_BASE_URL / _API_KEY).
#gmepay.kyb.octa.base-url=
#gmepay.kyb.octa.api-key=

# Kafka fan-out of screening results to gmepay.kyb.screening. The
# KafkaEventPublisher auto-config (lib-events-kafka) only activates when
# spring.kafka.bootstrap-servers is set; without it the LogEventPublisher
# fallback records each event at INFO. Compose/production set
# SPRING_KAFKA_BOOTSTRAP_SERVERS.
#spring.kafka.bootstrap-servers=

# Surface the human-readable reason on ResponseStatusException so callers
# (config-registry's RestKybClient) can relay meaningful error messages.
server.error.include-message=always
