plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Actuator (feat/actuator-health): /actuator/health + liveness/readiness probes + /actuator/metrics.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    // Resilience hardening on the OUTBOUND scheme edge (feat/resilience-scheme-breaker):
    // per-scheme circuit breaker + bulkhead so one dead/slow QR scheme fails fast and triggers
    // failover instead of hanging/hammering. 2.2.0 is the resilience4j line for Spring Boot 3.3.x.
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.4.0'
    implementation 'org.flywaydb:flyway-core'
    implementation project(':libs:lib-money')
    implementation project(':libs:lib-errors')
    implementation project(':libs:lib-events')
    // Phase 2 cross-service contracts: canonical PaymentApprovedPayload (event wire form) +
    // Prefunding reserve/release/deduction-history DTOs bound by the REST clients.
    implementation project(':libs:lib-api-contracts')
    // T5-3: the sanctions/PEP screening PORT + provenance vocabulary (ScreeningResult /
    // ScreeningProvenance / NOT_SCREENED_NO_PROVIDER). Reused rather than re-declared so the T1-4
    // guarantee -- a non-authoritative CLEAR is structurally impossible -- holds on the payment path
    // too. lib-kyb is deliberately dependency-light (spring-context + jackson-annotations + slf4j)
    // precisely so a service can bind to the port, per its own build file's note.
    implementation project(':libs:lib-kyb')

    // T3-11: distributed scheduler locking. Five @Scheduled jobs run on every instance, including the
    // authorization-expiry sweeper (which RELEASES prefunding holds) and the revenue-posting replay
    // (which spends a bounded retry budget). Version matches prefunding (5.16.0), the service that
    // already had this working -- see com.gme.pay.payment.config.ShedLockConfig.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.16.0'

    runtimeOnly 'org.postgresql:postgresql'
    // Flyway 10 ships PostgreSQL support as a separate artifact; required when the
    // migrations run against real PostgreSQL (docker-tagged ITs / production).
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    // H2 (PostgreSQL mode) backs the no-Docker unit slices only.
    runtimeOnly 'com.h2database:h2'

    // Pulls in spring-test (MockRestServiceServer), JUnit, AssertJ — needed by the
    // REST-adapter tests. No other new runtime deps were introduced for Phase-1 wiring.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Docker-backed ITs (@Tag("docker"), run via :integrationTest in CI only — this
    // machine has no Docker; locally these classes compile but are skipped by tag).
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.1')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}
