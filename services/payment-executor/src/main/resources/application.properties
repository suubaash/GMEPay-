spring.application.name=payment-executor
server.port=8084

# ---- datasource (17.2-G08: execution_attempts + idempotency_keys) ----
# Defaults to in-memory H2 (PostgreSQL mode) so unit slices run without Docker.
# Production / docker ITs override via SPRING_DATASOURCE_* (real PostgreSQL 16).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:payment_executor;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway is the only schema manager; Hibernate must never DDL. No explicit dialect —
# Hibernate auto-detects (H2 locally, PostgreSQL in docker ITs/production).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---- downstream service base URLs (Phase-1 wiring) ----
# Each adapter reads its own gmepay.<service>.base-url property; the default values
# below match the in-cluster DNS names used in INTER_SERVICE_CONTRACTS.md.
gmepay.config-registry.base-url=http://config-registry:8080
gmepay.rate-fx.base-url=http://rate-fx:8080
gmepay.sim-rate-provider.base-url=http://localhost:9101
gmepay.prefunding.base-url=http://prefunding:8080
gmepay.merchant-qr-data.base-url=http://merchant-qr-data:8080
gmepay.scheme-adapter-zeropay.base-url=http://scheme-adapter-zeropay:8080
# Per-scheme adapter base-urls (scheme-keyed dispatch, see SchemeClientRouter).
# gmepay.scheme-adapters.<CODE>.base-url routes scheme=<CODE> to that adapter;
# schemes without an entry fall back to the ZeroPay default above.
gmepay.scheme-adapters.NEPAL.base-url=http://localhost:18091
gmepay.scheme-adapters.SENDMN.base-url=http://localhost:8093
gmepay.transaction-mgmt.base-url=http://transaction-mgmt:8080
gmepay.revenue-ledger.base-url=http://revenue-ledger:8080

# ---- operational-status kill-switch client (defect #4: fail-CLOSED for security) ----
# The OperationalGate is a kill switch. On an unreachable config-registry with no fresh/last-known-good
# cache, the DEFAULT is to fail-CLOSED for the security flags (deny new authorization) rather than let a
# suspended/paused partner transact during an outage. A last-known-good cached value is always preferred.
# Set fail-open=true only to restore the legacy allow-on-outage behavior (trades kill-switch safety for
# availability). Hard connect + read timeouts stop a HUNG registry from stalling the pay path; a timeout
# is treated as unreachable → the fail-closed-security rule applies.
gmepay.ops.status.fail-open=false
gmepay.ops.status.cache-ttl-millis=3000
gmepay.ops.status.connect-timeout-millis=500
gmepay.ops.status.read-timeout-millis=500

# ---- scheme operating hours / cutoffs (gap T3-6) ----
# The scheme's PUBLISHED weekly window (config-registry scheme_operating_hours, V024) is enforced on the
# NEW-payment path only: a payment aimed at a CLOSED scheme is refused with the canonical SCHEME_CLOSED
# (409, non-retryable) before any float moves and before any scheme call. Confirm/cancel/refund are
# deliberately NEVER gated — an in-flight payment must complete and a refund must remain possible after
# the window closes.
#
# Three verdicts, never two: a scheme with NO usable row for the current scheme-local weekday is
# UNVERIFIED, which PERMITS the payment (four of the nine rostered schemes, including the live NEPAL and
# SENDMN corridors, have no seeded rows — refusing would take them offline over missing reference data)
# and raises a de-duplicated SCHEME_HOURS_UNVERIFIED ops alert. Nothing anywhere reads "no row" as "open".
#
# cutoff_time_local is NOT a close: it is the daily SETTLEMENT cutoff (ZEROPAY = 24x7 rail with a 16:30
# KST KFTC cutoff), so it never rejects a payment — a past-cutoff payment simply books to the next value
# date. Settlement's own cutoff behaviour is untouched by this gate.
#
# The rows are migration-seeded reference data, so the per-scheme cache TTL is long (10 min) and the read
# carries hard timeouts; an unreadable schedule degrades to UNVERIFIED (visible), never to a wrong "open"
# and never to a blocked corridor. Setting enforcement-enabled=false logs an ERROR banner at startup.
gmepay.scheme-hours.enforcement-enabled=true
gmepay.scheme-hours.cache-ttl-millis=600000
gmepay.scheme-hours.connect-timeout-millis=500
gmepay.scheme-hours.read-timeout-millis=500

# ---- Sanctions / PEP screening on the payment path (T5-3) — NO PROVIDER IS CONFIGURED ----
# Read this block before assuming any AML control exists in this service.
#
# There is NO transaction-level sanctions/PEP screening on this platform. Nothing screens a payer, a
# beneficiary or a merchant against any sanctions list, PEP register or adverse-media source. The only
# screening anywhere is the ONBOARDING-time partner KYB call (config-registry -> kyb-adapter), which
# screens the licensed institution and its UBOs, not the parties to a payment — and even that has no
# real vendor (ADR-014, Octa sandbox credentials pending).
#
# Note also that the "AML gates" in PaymentOrchestrator are NOT screening: they are four numeric
# comparisons against operator-entered caps (per-txn USD min/max, daily/monthly/annual USD, daily txn
# count). They are regulatory transaction limits under the 소액해외송금업 licence. They screen nobody.
#
# What DOES exist is the seam and an honest accounting of its emptiness. PaymentScreeningGate runs on
# both new-payment entry points (via OperationalGate, so they cannot drift the way T4-2's did), asks the
# PaymentScreeningPort, and for every unscreened party: logs a WARN, increments the Micrometer counter
# gmepay.payments.screening.unscreened, counts it durably in unscreened_payments (Flyway V010), and
# raises a PAYMENT_SCREENING_UNAVAILABLE ops alert de-duplicated to one per (reason, party, UTC date) —
# per-payment would be an alert nobody reads, since today EVERY payment is unscreened. An ERROR startup
# banner names the missing bean. Coverage is queryable at GET /internal/ops/screening-coverage, which
# always returns the posture (screeningActive/providerId) alongside the counts so a zero cannot be
# misread as coverage.
#
# INTEGRATING A REAL PROVIDER is one bean: a PaymentScreeningPort that calls the vendor and stamps
# ScreeningProvenance.vendor(id). PaymentScreeningConfig's @ConditionalOnMissingBean default steps aside.
# Note the second half of the gap, which no vendor purchase fixes on its own: neither payment contract
# carries an originator NAME (API-05 authorize has customer_ref, the wallet has userRef — both opaque),
# so a name-matching provider would still screen nobody until those contracts carry a screenable
# identity. That is counted separately as NO_SUBJECT_IDENTITY.
#
# fail-closed=false is DELIBERATE and is the opposite of the KYB activation default (which REFUSES an
# unscreened partner, T1-4). Activation is a one-off, human-paced gate where refusing costs a delay on
# one partner; a live payment path is not — refusing here stops ZEROPAY, NEPAL and SENDMN completely,
# for a control that has never existed in any environment. Whether to stop taking money is the owner's
# and compliance's decision, not a side effect of shipping a seam. Setting it to true is a KILL SWITCH,
# not a hardening step: with no provider wired it refuses EVERY payment with
# SANCTIONS_SCREENING_UNAVAILABLE (422, non-retryable, no float moved, no scheme call). It logs an ERROR
# banner at startup when armed. An authoritative provider's HIT / NEEDS_REVIEW is refused ALWAYS,
# regardless of this flag — the flag governs what happens when we know nothing, not when we know
# something bad.
gmepay.screening.fail-closed=false

# ---- DECLINE_SPIKE ops alert (defect #5) — ON by default since T3-3 / COO#4 ----
# Rolling per-partner / per-scheme decline-rate monitor; emits a DECLINE_SPIKE ops.alert when the decline
# rate over the window exceeds the threshold (min-samples guard + per-subject cooldown).
#
# This monitor and transaction-mgmt's stuck-transaction sweeper are the platform's only two production
# safety nets on the money path, and BOTH used to be default-OFF, so a 100% decline spike paged nobody.
# The bean is now @ConditionalOnProperty(matchIfMissing = true) and this line ships as true; setting it
# to false must be an explicit operator decision, never an omission. Pinned by
# DeclineSpikeMonitorDefaultOnTest, which reads THIS file — so the regression cannot come back quietly.
# Thresholds match the in-code defaults and are restated here so they are tunable/auditable from config.
gmepay.decline-spike.enabled=true
# Rolling window per subject (partner code AND scheme id are tracked independently).
gmepay.decline-spike.window-seconds=60
# Minimum in-window authorizations before a rate is trusted (stops 1 decline = 100%).
gmepay.decline-spike.min-samples=20
# Fire above this decline rate; >=0.80 escalates the alert from WARN to CRITICAL.
gmepay.decline-spike.threshold-rate=0.5
# Per-subject suppression after firing, so one outage does not spam the notification sink.
gmepay.decline-spike.cooldown-seconds=300

# ---- SENDMN overseas payment settings ----
# CFO#11: the corridor's commercial terms (FX margin + service fee) belong to config-registry
# (partner_fx_config V019 / partner_fee_schedule V018, edited in the partner step-6 commercial panel),
# NOT to this file. gmepay.payment.sendmn.fx-margin=0.02 used to live here, which meant a margin an
# owner entered in the registry could never take effect: the property always won. It is deliberately
# UNSET now so config-registry is consulted. Until an owner enters the terms there, SendmnCorridorPricing
# keeps charging the corridor's historical 2% / 500 KRW as clearly-labelled CODE DEFAULTS (a startup-time
# WARN per term + a readable provenance) — the pricing does not change, it stops being invisible.
#
# Set the two keys below ONLY as a local/sim/pre-onboarding escape hatch; they override the registry.
#   gmepay.payment.sendmn.fx-margin=0.02          (decimal fraction)
#   gmepay.payment.sendmn.service-fee-krw=500     (flat KRW)
#
# The USD/KRW basis is a different question and is NOT a price: it converts the KRW charge into the USD
# the prefunding float is debited by and the T4-2 cap is measured on, and it still falls back to the
# sanctioned 1350 constant during a rate outage rather than taking a live corridor down (the fallback is
# WARNed per use and counted by settlement-reconciliation's fallback_rate_basis_count, T2-2). Set
# gmepay.payment.sendmn.usd-basis-strict=true to prefer refusing (503 CORRIDOR_RATE_UNAVAILABLE) instead.
gmepay.payment.sendmn.usd-basis-strict=false

# ---- GMEREMIT wallet payment settings ----
# STRICT is the only non-dev behavior: a merchant-qr-data miss/unreachable HARD-FAILS the GMEREMIT
# payment with MERCHANT_NOT_FOUND (404). Synthesizing a placeholder UNKNOWN merchant is a DEV-ONLY
# escape hatch behind the explicit flag below (default false). Leaving it false means a stray config
# can never weaken merchant validation in production.
gmepay.payment.dev-synth-merchant=false
# (legacy) SendmnPaymentService still reads gmepay.payment.merchant-validation; kept for that path.
gmepay.payment.merchant-validation=strict

# ---- outbound-scheme resilience (feat/resilience-scheme-breaker) ----
# Per-scheme circuit breaker + bulkhead + sync call timeout on the OUTBOUND scheme calls, so a dead
# or slow QR scheme fails fast and triggers failover (ResilientSchemeClient) instead of hanging or
# hammering the adapter. Breaker/bulkhead instances are created programmatically keyed on the scheme
# id (e.g. NEPAL, ZEROPAY), so a tripped scheme does NOT trip the others. These 'default' configs are
# applied by the registry to every named instance; all values are override-able.
#
# Circuit breaker: over a sliding window of the last 10 calls, OPEN when >=50% fail; stay OPEN 10s,
# then allow 3 half-open trial calls before deciding CLOSED/OPEN again. An OPEN breaker short-circuits
# with CallNotPermittedException (no HTTP call → no charge), which ResilientSchemeClient maps to a
# technical SchemeTimeoutException so FailoverPaymentRouter fails over to the next candidate.
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
# A synchronous business decline is authoritative, not a fault, so it must NOT count toward the
# breaker's failure rate (only technical faults should trip a scheme). record-failure-predicate keeps
# SchemeDeclinedException out of the failure tally; everything else (timeout/5xx/connect) counts.
resilience4j.circuitbreaker.configs.default.record-failure-predicate=com.gme.pay.payment.client.rest.SchemeFailureRecordPredicate

# Bulkhead (semaphore): at most 16 concurrent in-flight calls per scheme; extra callers are rejected
# fast with BulkheadFullException (also mapped to the technical failover path) rather than queuing
# against a stalled scheme. max-wait-duration=0 = do not block waiting for a permit.
resilience4j.bulkhead.configs.default.max-concurrent-calls=16
resilience4j.bulkhead.configs.default.max-wait-duration=0

# Synchronous call timeout on the scheme RestClients (RestSchemeClient / NepalRestSchemeClient): a
# hung socket aborts in a few seconds (ResourceAccessException → SchemeTimeoutException) instead of
# hanging forever. NOT resilience4j TimeLimiter (that is for async CompletableFuture calls).
gmepay.scheme.connect-timeout-millis=2000
gmepay.scheme.read-timeout-millis=5000

# ---- T3-11: internal (non-scheme) outbound HTTP budget ------------------------------------------
# Until T3-11 these hops had NO read timeout at all. Every Rest*Client fed by Boot's shared
# RestClient.Builder -- transaction-mgmt, rate-fx, qr-service, prefunding, revenue-ledger,
# config-registry, smart-router -- would wait indefinitely on a peer that accepted the connection and
# then stopped answering, holding a Tomcat worker until the OS closed the socket
# (RUNBOOK_LOAD_AND_CAPACITY.md §4.1 #7). Under load that is what turned a slow dependency into
# UNCERTAIN payments and manual ops work.
#
# lib-errors (com.gme.pay.http.HttpClientTimeoutAutoConfiguration) now puts a 2s/10s floor on every
# service in the fleet. payment-executor tightens the READ half to 5s here, because 10s is the right
# default for a report and the wrong one for a step inside a live payment: the scheme leg above
# already gives up at 5s, so an internal hop permitted 10s could outlive the payment it belongs to.
# No internal dependency may hold a payment longer than the scheme is allowed to.
#
# 5s -- not less -- because a timeout here is not free. prefunding.capture and
# transaction.commitStatus are operations whose outcome becomes UNKNOWN when the call is abandoned,
# and each unknown is reconciliation work. The value is set well clear of any healthy in-cluster call
# so that firing means something is genuinely wrong rather than that the platform was briefly busy.
# These are engineering parameters, not an SLO: no partner is promised either number.
#
# Anti-double-charge (ADR-016 §4) is unaffected by design: a read timeout surfaces as
# ResourceAccessException, which the scheme clients already map to SchemeTimeoutException and the
# orchestrator already routes to UNCERTAIN + the idempotent status probe. A timeout NEVER re-submits.
gmepay.http.client.connect-timeout=2s
gmepay.http.client.read-timeout=5s

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
#
# T3-2: `prometheus` is NOT listed here and must not be added here -- it is appended to this list for
# EVERY service by com.gme.pay.platform.MetricsExposureEnvironmentPostProcessor (libs/lib-errors), so
# the fleet cannot drift back to "the endpoint is claimed in a comment but 404s". The Micrometer
# registry that backs it comes from the root build.gradle `plugins.withId('org.springframework.boot')`
# block. /actuator/prometheus is gated by the internal token (see SandboxSurfaceInternalAuthConfig
# INTROSPECTION_PATTERNS) -- a scraper must send X-Gme-Internal.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Tag every metric with the service name so one Prometheus can hold the whole fleet.
management.metrics.tags.application=payment-executor

# ---- Ops alerting: durability + notification sink (T3-3) ----
# Every emitted alert is persisted to ops_alerts (Flyway V006) BEFORE it is published or notified, so
# it survives a restart of this service, the broker and ops-partner-bff (whose consumer-side store is
# still a 200-entry in-memory deque). Read it back at GET /internal/ops/alerts (internal-token gated).
gmepay.ops.alerts.retention-days=90
gmepay.ops.alerts.prune-enabled=true
gmepay.ops.alerts.prune-interval-ms=21600000
# Outbound notification sink. NO webhook-url is set on purpose: @ConditionalOnProperty matches an EMPTY
# value, so shipping a blank URL would activate the webhook sink with no target and fail every
# delivery. With nothing set, LogAlertSink logs at WARN. To page a human, set ONE variable and restart:
#   GMEPAY_ALERT_SINK_WEBHOOK_URL=https://hooks.slack.com/services/...   (or PagerDuty/Opsgenie/Teams)
# See Documentation/RUNBOOK_MONITORING.md. Timeout/retries below apply to that sink.
gmepay.alert.sink.timeout-ms=3000
gmepay.alert.sink.max-attempts=3

# ---- Ledger operations: posting replay + day close + FX exposure (T2-5 / CFO#6, #9, #10) ----
# All three jobs are ON by default (@ConditionalOnProperty matchIfMissing=true), matching this service's
# T3-3 ops convention (gmepay.decline-spike.enabled, gmepay.ops.alerts.prune-enabled). Turning one off must
# be an explicit operator decision, never an omission -- with the replay off, booked revenue that failed to
# reach revenue-ledger stays permanently missing, which IS gap T2-5. Every run is recorded in
# ledger_ops_runs (Flyway V008, own transaction so a FAILED run survives its own rollback) and a failure
# alerts through the existing ops.alert pipeline. None of the three consults a business-day calendar: money
# moves on Korean banking holidays, so a holiday is still replayed and still closed.
#
# (1) Revenue-posting replay -- drains revenue_posting_failures back into revenue-ledger. Every target
# endpoint is idempotent on its reference, so a replay of a posting that already landed is a no-op there and
# is recorded as ALREADY_PRESENT here. max-attempts is bounded by the EXISTING `attempts` column; on
# exhaustion the row becomes POISON, stops being retried, and raises a CRITICAL REVENUE_POSTING_POISON alert.
gmepay.revenue-posting-replay.enabled=true
gmepay.revenue-posting-replay.interval-ms=300000
gmepay.revenue-posting-replay.initial-delay-ms=60000
gmepay.revenue-posting-replay.batch-size=100
gmepay.revenue-posting-replay.max-attempts=8
gmepay.revenue-posting-replay.base-backoff-seconds=60
gmepay.revenue-posting-replay.max-backoff-seconds=21600

# (2) Day close -- the persisted three-way artifact (transactions vs ledger journal vs prefunding movements)
# for YESTERDAY in the close timezone. Closing the current date would produce an artifact that is wrong by
# construction. The ledger leg is QUOTED from revenue-ledger's trial-balance + journal-reconciliation
# endpoints, never recomputed.
gmepay.day-close.enabled=true
gmepay.day-close.cron=0 30 2 * * *
gmepay.day-close.zone=Asia/Seoul
# Prefunding partner codes whose float the close ties out. NO DEFAULT ON PURPOSE: prefunding is keyed by
# partner CODE and transaction-mgmt carries none, so the codes cannot be derived. Left blank, the prefunding
# leg reports available=false with that reason rather than reporting zero float movement -- "we could not
# look" and "nothing moved" must never render identically. Set it per deployment, e.g.
#   GMEPAY_DAY_CLOSE_PARTNER_CODES=SENDMN,GMEREMIT
gmepay.day-close.partner-codes=${GMEPAY_DAY_CLOSE_PARTNER_CODES:}

# (3) FX exposure -- the DERIVED net open position per currency (collected vs paid out vs settled, and the
# back-derived USD rate basis). A measurement only: no hedge is proposed, no target position exists, nothing
# is revalued and no currency is netted against another. window-days is a rolling window ending at the last
# closeable date; cost is one paged transaction read per day in it.
gmepay.fx-exposure.enabled=true
gmepay.fx-exposure.cron=0 0 3 * * *
gmepay.fx-exposure.window-days=7
# Detects collections priced off the hub's HARDCODED USD fallback constant during a rate-provider outage, by
# back-deriving units-per-USD and comparing (the same technique T2-2's corridor tie-out uses). Mirrors
# SendmnPaymentService.KRW_PER_USD; it is a DETECTOR, not a rate -- nothing here prices anything. The
# constant itself still needs treasury sign-off (CFO#9), which is not a code change.
gmepay.fx-exposure.fallback-basis-currency=KRW
gmepay.fx-exposure.fallback-basis-rate=1350
gmepay.fx-exposure.fallback-basis-tolerance=1

# ---- Ledger-ops run ledger: missed-run detection + retention (T2-5 caveat (e)) -------------------
# ledger_ops_runs makes a FAILED run loud, but every one of those signals is produced BY the run. A run
# that never starts produces none of them -- no row, no exception, no alert -- and the table simply
# stops growing. For a scheduled financial job that is the failure mode that matters: a silent absence,
# not a loud error. A crashed scheduler thread, a ShedLock row wedged by a pod that died holding it, an
# enabled flag turned off in one environment, a cron edited into a window that never fires -- all of
# them look like "nothing has gone wrong" from inside this service.
#
# MissedLedgerOpsRunMonitor checks, per job, how long since ANY run was recorded, and raises
# LEDGER_OPS_RUN_MISSED (CRITICAL) through the SAME T3-3 ops.alert pipeline as every other alert here.
# Outcome is not considered: a FAILED run happened and has its own alert. Only silence is detected.
#
# NONE OF THE VALUES BELOW IS AN SLO OR A COMMITMENT TO ANYONE. Each is set at a small multiple of the
# job's own cadence so one skipped cycle is not an incident but a stopped job is. AN OWNER SHOULD
# CONFIRM all four against how quickly finance needs to know and what on-call will tolerate:
#   * replay (runs every 5m)        -> PT30M  = six missed cycles
#   * day-close (daily 02:30 KST)   -> PT26H  = a day plus two hours of slack
#   * fx-exposure (daily 03:00 KST) -> PT26H  = as above
#   * cooldown                      -> PT6H   = repeat suppression, per JVM (see the class javadoc)
# A job whose own enabled flag is false is NOT monitored -- its silence is intended, and paging about a
# deliberately-disabled job is how an alert type becomes noise. REVENUE_POSTING_REQUEUE is never
# monitored either: it is an operator act, so "nobody requeued anything today" is the normal state.
gmepay.ledger-ops.missed-run.enabled=true
gmepay.ledger-ops.missed-run.check-interval-ms=900000
gmepay.ledger-ops.missed-run.initial-delay-ms=300000
gmepay.ledger-ops.missed-run.max-silence.revenue-posting-replay=PT30M
gmepay.ledger-ops.missed-run.max-silence.day-close=PT26H
gmepay.ledger-ops.missed-run.max-silence.fx-exposure=PT26H
gmepay.ledger-ops.missed-run.cooldown=PT6H

# Retention. The table gained a row every 5 minutes from the replay sweeper and nothing ever removed
# one -- ~105k rows a year from that job alone, each up to 4 KB of stack excerpt on a failure. An
# append-only audit table with no expiry is a slow disk-full, and the disk it fills belongs to the
# database the money path writes to.
#
# 365 DAYS IS AN ENGINEERING DEFAULT, NOT A RECORDS-RETENTION COMMITMENT, and an owner should confirm
# it. Longer than ops_alerts' 90 days because this is an execution record for financial jobs, not an
# incident feed -- "did the day-close run every night last year?" is a fair audit question that 90 days
# cannot answer. NOT set to a statutory multi-year horizon because this table is not a transaction
# record: it holds no amounts, no counterparties and no postings, only whether a job ran. If compliance
# concludes otherwise, this is one property and the pruner honours it unchanged.
#
# The newest run of EACH job is never pruned, whatever its age: missed-run detection reads exactly that
# row, so without the exception a job silent for longer than the window would have its last trace
# deleted and "silent for 400 days" would become indistinguishable from "no history".
gmepay.ledger-ops.runs.prune-enabled=true
gmepay.ledger-ops.runs.retention-days=365
gmepay.ledger-ops.runs.prune-interval-ms=21600000
gmepay.ledger-ops.runs.prune-initial-delay-ms=600000

# ---- dev/sandbox surfaces: OFF by default (T0-5 / CISO#6) ----
# gmepay.sandbox.e2e.enabled gates the E2E payment runner (/v1/sandbox/e2e/**). POST /run performs a
# REAL authorize+capture over the real pay path (prefunding debit, scheme call, ledger postings), so
# an open runner is an anonymous "spend money" button. false => SandboxE2eController / E2eRunner /
# SelfPayClient are not registered at all and the path 404s (nothing to probe).
# gmepay.devtools.enabled gates DevDataController (/__data/**), a read-only dump of every table.
# When EITHER is turned on, SandboxSurfaceInternalAuthConfig requires the shared internal-auth token
# on that path and the service REFUSES TO START without GMEPAY_INTERNAL_AUTH_SECRET.
gmepay.sandbox.e2e.enabled=false
gmepay.devtools.enabled=false

# ---- service-to-service internal-auth token (T0-5 / CISO#6, extended by T0-2) ----
# The platform's shared internal token (com.gme.pay.internalauth, #90). Used here for BOTH directions:
#  - outbound: presented in the X-Gme-Internal header on every call to
#      * prefunding — its entire balance API is gated (services/prefunding application.properties),
#        RestPrefundingClient;
#      * scheme-adapter-zeropay — its whole /internal/scheme/** surface is gated
#        (services/scheme-adapter-zeropay application.properties), RestSchemeClient.
#    Without the secret those calls carry no header and are refused 401, i.e. payments decline.
#  - inbound: required on GET /v1/balance ALWAYS (T0-2 — it reads any partner's float and used to
#    trust X-Partner-Id/X-Partner-Type headers with fail-open defaults; see
#    SandboxSurfaceInternalAuthConfig.BALANCE_PATTERN), and on the dev/sandbox surfaces above when
#    they are enabled.
# NO default value: it must come from the GMEPAY_INTERNAL_AUTH_SECRET environment variable. A blank
# value still boots (so a bare local run keeps serving payments) but then NO caller can read
# /v1/balance — the filter can match no credential — which is fail-closed, not a bypass.
gmepay.internal-auth.secret=${GMEPAY_INTERNAL_AUTH_SECRET:}

# ---- T3-11: @Scheduled thread pool ---------------------------------------------------------------
# `spring.task.scheduling.pool.size` was set in NO file anywhere in this repo, so Spring's default of
# ONE thread applied to every service. payment-executor stacks FIVE: the authorization-expiry sweeper (60s), the ops-alert retention prune (6h), the revenue-posting replay (5m), the nightly FX-exposure measurement and the scheduler-lag heartbeat.
#
# One thread means these jobs do not merely run late under load — they run in strict sequence, so a
# slow job blocks its siblings entirely. The authorization-expiry sweeper is the one that releases prefunding holds; a replay sweep that stalls on an unresponsive revenue-ledger would hold the only thread and leave partner float reserved against authorizations that expired hours ago.
#
# Sized to the job count so no job can be starved by a sibling. This is not a throughput lever: these
# are latency-insensitive background jobs and 4 threads at ~1 MB of stack each is a rounding
# error against the heap. It is a correctness lever, because the starved jobs are the safety nets.
#
# The starvation was also SILENT: no scheduler-lag metric existed. lib-errors now registers one
# automatically (gmepay.scheduler.lag / .lag.max / .pool.size / .active / .queued) on every service
# with @EnableScheduling — see com.gme.pay.metrics.SchedulerLagProbe.
#
# Raised 4 -> 6 with the two ledger-ops observability jobs (missed-run detection every 15m, run-ledger
# retention every 6h). Sizing it for the missed-run monitor specifically matters: it is the job whose
# entire purpose is to notice that another job stopped, so starving it behind a slow sibling would
# produce silence about silence.
#
# Raised 6 -> 8, because 6 was arrived at by an argument rather than a count. It covered the five
# always-on fixed-delay jobs plus the lag heartbeat, on the reasoning that "the two nightly crons are
# 30 minutes apart and cannot contend". That reasoning is an assumption about RUNTIME DURATION, and
# nothing measures or enforces it: day-close starts at 02:30 and FX-exposure at 03:00, so a day-close
# that runs longer than thirty minutes — which is precisely what a high-volume day produces — has both
# crons live at once, and 7 jobs + the heartbeat then need 8 threads while 6 are available. The two
# that queue are chosen by arrival order, so the loser can be AuthorizationExpirySweeper, the job that
# releases prefunding holds.
#
# 8 = 7 @Scheduled methods + the heartbeat, counted, with no argument in it. Two extra platform
# threads at ~1 MB of stack each is a rounding error against a 320 MB heap; a night when the sweeper
# does not run is partner float reserved against authorizations that expired hours ago. The count is
# now enforced by SchedulerPoolSizeWiringGuardTest in lib-errors, so the next job added here fails the
# build instead of re-opening this by arithmetic drift.
spring.task.scheduling.pool.size=8
