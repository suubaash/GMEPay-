spring:
  application:
    name: scheme-adapter-nepal
  # Persistence for GME's prepaid float held WITH the Nepal scheme (gme_scheme_balance).
  # Defaults to in-memory H2 in PostgreSQL-compat mode so tests/local runs need no Docker;
  # production overrides via SPRING_DATASOURCE_* env vars. Flyway owns the schema (ddl-auto=none).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:nepaladapterdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

server:
  port: 8092

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Management port intentionally NOT overridden — the fleet/compose probes assume the app port
# (8092). Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off; show-details=never.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Nepal QR scheme (Khalti/Fonepay) — targets sim-nepal-qr :9103.
# Override in production with GMEPAY_SCHEME_NEPAL_* environment variables.
gmepay:
  scheme:
    nepal:
      enabled: true
      # sim-nepal-qr base URL
      base-url: http://localhost:9103
      # Authorization: Token <token> for /api/qr/validate/
      token: sim-token
      # Authorization: Key <key> for /qrscan-thirdparty/pay/ and /status/
      key: sim-key
      # GME's opening prepaid float held WITH the Nepal scheme (NPR), seeded once into
      # gme_scheme_balance. The pre-submit balance-check reads it live; every committed payout
      # debits it (paisa converted to NPR), top-ups credit it. Default ₨100,000,000.
      opening-prepaid-balance-npr: 100000000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
