spring:
  application:
    name: scheme-adapter-nepal

server:
  port: 8092

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Management port intentionally NOT overridden — the fleet/compose probes assume the app port
# (8092). Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off; show-details=never.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Nepal QR scheme (Khalti/Fonepay) — targets sim-nepal-qr :9103.
# Override in production with GMEPAY_SCHEME_NEPAL_* environment variables.
gmepay:
  scheme:
    nepal:
      enabled: true
      # sim-nepal-qr base URL
      base-url: http://localhost:9103
      # Authorization: Token <token> for /api/qr/validate/
      token: sim-token
      # Authorization: Key <key> for /qrscan-thirdparty/pay/ and /status/
      key: sim-key
      # Request signing (issuance-extension): RSA-2048 / PKCS#1 v1.5 / SHA-256 over base64(data).
      # NO key is shipped. All three keys below are intentionally EMPTY, so an unconfigured
      # deployment FAILS CLOSED — signed /pay and /status calls are refused rather than sent with a
      # placeholder signature (gap T4-1).
      signing:
        # PKCS#8 private key, PEM or bare base64 DER. Supply via
        # GMEPAY_SCHEME_NEPAL_SIGNING_PRIVATE_KEY (env/secret), never in a committed file.
        private-key: ""
        # …or a path to a mounted secret file containing the same.
        private-key-path: ""
        # EPHEMERAL_DEV = generate a throwaway RSA-2048 keypair at startup, for local/sim runs only
        # (sim-nepal-qr soft-logs signatures). Explicit opt-in; leave empty everywhere else.
        mode: ""

  # T3-11: outbound HTTP budget (Nepal leg).
  # Until T3-11 this adapter's outbound leg had NO read timeout: it took Boot's shared
  # RestClient.Builder, which carries none, so a Nepal endpoint that accepted the connection and
  # then stopped answering held this adapter's request thread until the OS closed the socket
  # (RUNBOOK_LOAD_AND_CAPACITY.md section 4.1 #7).
  #
  # lib-errors (com.gme.pay.http.HttpClientTimeoutAutoConfiguration) now puts a 2s/10s floor on every
  # service in the fleet. This adapter tightens the READ half to 4s, and the number is chosen for its
  # NESTING, not for speed:
  #
  #     scheme adapter -> Nepal     4s   (this value)
  #     payment-executor -> adapter    5s   (gmepay.scheme.read-timeout-millis in payment-executor)
  #
  # Strictly inside its caller's budget. If this leg were the looser of the two, payment-executor
  # would abandon the hub->adapter call first and infer "unknown" from its own socket timeout --
  # which is exactly how load turns into UNCERTAIN payments an operator resolves by hand. At 4s the
  # adapter gives up first and answers with a definite SCHEME_UNAVAILABLE that carries a reason.
  #
  # What a timeout must NOT do here: resolve the ambiguity. A submit that times out may still have
  # moved money. ResourceAccessException is already mapped to the technical/ambiguous outcome in this
  # adapter's client, which payment-executor routes to the ADR-016 section 4 idempotent status probe.
  # Nothing re-submits.
  #
  # Engineering parameter, not an SLO -- no partner is promised either number. If Nepal's real API
  # SLA turns out to exceed 4s, BOTH this and payment-executor's 5s must be raised, in that order.
  http:
    client:
      connect-timeout: 2s
      read-timeout: 4s
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
