// scheme-adapter-nepal: ACL adapter for the Nepal QR scheme (Khalti/Fonepay).
// Counterpart to sim-nepal-qr (:9103). Real-time REST, plus a small persistence layer for
// GME's prepaid float held WITH the scheme (gme_scheme_balance) — the pre-submit balance-check.
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Actuator (feat/actuator-health): /actuator/health + liveness/readiness probes + /actuator/metrics.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.flywaydb:flyway-core'
    implementation project(':libs:lib-errors')

    // Flyway 10.x ships PostgreSQL support as a separate module (production / Postgres runs);
    // H2 support stays in flyway-core for the in-memory default and slice tests.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
}
