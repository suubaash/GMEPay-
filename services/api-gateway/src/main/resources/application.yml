spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false        # manual route registration only
      default-filters:
        - AddRequestHeader=X-Gateway-Version, v1
  # Slice 1 (ADR-011): OAuth2 resource server. Human traffic from admin-ui /
  # partner-portal-ui bears OIDC-issued JWTs. Provider-neutral: the issuer URI is
  # injected and accepts ANY OIDC issuer (self-hosted Keycloak or any cloud IdP) —
  # it is NOT pinned to a literal Keycloak URL. The default below targets the
  # docker-compose Keycloak service (realm = gmepay) for local dev only.
  #   OIDC_ISSUER_URI  — provider-neutral env name (preferred; works for any IdP)
  #   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI — set this only when
  #   the IdP's OIDC discovery (.well-known) is unreachable and JWKS must be pinned.
  # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI also still works (Spring
  # relaxed binding) and takes precedence if both that and OIDC_ISSUER_URI are set.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8090/realms/gmepay}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # feat/actuator-health: fleet-standard surface (health,info,metrics).
        #
        # T3-2: this comment used to say "prometheus dropped -- micrometer-registry-prometheus is not on
        # the classpath", while build.gradle's comment claimed the endpoint and SecurityConfig
        # permitAll'd it. That contradiction WAS gap T3-2: /actuator/prometheus 404'd on all 19 services.
        # The registry is now on every deployable's classpath (root build.gradle) and `prometheus` is
        # appended to this include list for every service by
        # com.gme.pay.platform.MetricsExposureEnvironmentPostProcessor (libs/lib-errors) -- so do NOT
        # add it here; the fleet-wide mechanism is the thing that cannot drift.
        # env/beans/heapdump/shutdown stay off.
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: api-gateway

# NOTE (T3-2): an `otel:` block used to sit here declaring an OTLP exporter endpoint
# (${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}) together with a matching
# OTEL_EXPORTER_OTLP_ENDPOINT in all four Helm values files. It was DEAD CONFIG: no service has an
# OpenTelemetry SDK, an OTLP exporter or micrometer-tracing on its classpath, no collector is deployed
# in docker-compose.yml or in the Helm chart, and `otel.*` is not a property namespace Spring Boot or
# Micrometer reads on its own. It has been REMOVED rather than "wired", because wiring it means adding
# a tracer to 20 services plus a collector deployment -- real work with a real operational cost, not a
# config line. Distributed tracing is therefore an OPEN, HONESTLY-STATED gap; see
# Documentation/RUNBOOK_MONITORING.md ("Not covered") and gap register T3-2. Correlation ids
# (X-Correlation-Id, in every log line via lib-errors) are the current substitute for trace ids.

# Per-API-version deprecation config (Phase 1: v1 is live, not deprecated)
api:
  versions:
    v1:
      deprecated: false

# Internal service-to-service token (#90). Presented in the X-Gme-Internal header on the gateway's
# two calls into auth-identity's internal-only surface:
#   - POST /v1/rbac/resolve             (RBAC claim resolver, only when rbac.stamp is enabled)
#   - POST /internal/auth/keys/resolve  (T0-7 partner-credential lifecycle check — EVERY partner request)
# No default: auth-identity's gate is enforced-by-default, so a blank secret can only produce 401s
# from it. The gateway therefore treats blank as "credential store unreachable" and answers partner
# requests 503 rather than skipping the check (AuthIdentityCredentialStatusClient).
gmepay:
  internal-auth:
    secret: ${GMEPAY_INTERNAL_AUTH_SECRET:}
  auth-identity:
    # Also read by the T0-7 credential lifecycle check. Compose/Helm already set
    # GMEPAY_AUTH_IDENTITY_BASE_URL on this service.
    base-url: ${GMEPAY_AUTH_IDENTITY_BASE_URL:http://auth-identity:8080}

gateway:
  # ─────────── SHARED EDGE STATE (replica ceiling) ───────────
  # The per-partner rate-limit window and the replay-protection nonce set are the two pieces of
  # cross-request state at the edge. While both lived in a ConcurrentHashMap the gateway could
  # only run ONE replica, and not for a performance reason: N replicas meant N x the configured
  # rate limit, and a captured signed request replayable once per replica. Both controls were
  # wrong above one instance, not merely un-scaled.
  #
  # ONE switch governs BOTH, deliberately — the half-shared configuration (global nonces, per-pod
  # rate limit) is a state nobody intends and anybody could produce with two keys.
  #   auto   (default) → redis when spring.data.redis.host is set, memory otherwise; logs which.
  #   redis            → redis, and REFUSE TO START if no host is configured.
  #   memory           → per-JVM; legal, logged WARN, replica ceiling 1.
  #   anything else    → REFUSE TO START (a typo must not pick a different store).
  # docker-compose and all four Helm values already export SPRING_DATA_REDIS_HOST for this
  # service, so `auto` resolves to redis in every deployed environment and to memory on a laptop.
  shared-state:
    store: auto

  # Replay protection (ReplayProtectionFilter, order 5). UNCONDITIONAL and fail-closed: an
  # HMAC-authenticated request without X-Nonce is 400 MISSING_NONCE, one over max-nonce-length is
  # 400 INVALID_NONCE, and a nonce seen twice inside the retention window is 401 REPLAY_DETECTED.
  #
  # on-store-error: what happens when the nonce store cannot answer. There is NO 'allow' value —
  # a replay check an attacker can disable by making one Redis unreachable is not a replay check.
  #   reject (default) → 503 REPLAY_STORE_UNAVAILABLE; the request is not forwarded. This makes
  #                      Redis a HARD DEPENDENCY of the partner edge. Stated, not discovered.
  #   local            → degrade to the per-JVM nonce set: one replay per replica inside the skew
  #                      window (the pre-Redis posture) instead of the edge going down.
  # An unrecognised value fails property binding and the service refuses to start.
  replay-protection:
    nonce-ttl-seconds: 300
    max-nonce-length: 256
    on-store-error: reject

  # Per-partner rate limiting (API-05 §3.5). T0-7: was `enabled: false` + `fail-open: true`.
  # Now on; the counter is shared across replicas so these numbers are the numbers enforced.
  #
  # on-store-error: T0-7's fail-closed default is UNCHANGED (deny). The Redis move added a third
  # honest option that a boolean could not express:
  #   deny  (default) → 429. An outage in the control that bounds enumeration must not hand an
  #                     attacker unlimited attempts. Cost: a Redis outage stops partner traffic.
  #   local           → degrade to the per-JVM window (cap becomes replicas x the value below).
  #                     RECOMMENDED for a multi-replica deployment that judges a Redis outage
  #                     worse than an N x cap. Still a cap; not an absence of one.
  #   allow           → no rate limiting during the outage. `fail-open: true` still means this.
  rate-limit:
    enabled: true
    fail-open: false
    on-store-error: deny
    global-per-second: 100
    rates-per-second: 20
    payments-per-second: 50

  # ─────────── PARTNER CREDENTIALS (T0-7) ───────────
  # `source: stub` used to be the default here and in ConfigPartnerCredentialProperties, selecting
  # a hard-coded bean whose api keys AND HMAC secrets were published in this repository
  # (pk_test_abc/sk_test_xyz, pk_test_no_mtls/sk_test_no_mtls) with no IP restriction. That bean is
  # DELETED from the shipped build and `source: stub` now makes the service refuse to start
  # (PartnerCredentialConfig).
  #
  # The table below is EMPTY by default and an empty table authenticates nobody — the partner API
  # answers 401 INVALID_API_KEY until an operator populates it. Every key is additionally required
  # to be ACTIVE in auth-identity's api_keys store, and an unreachable store yields 503, never a
  # bypass. See PartnerCredentialConfig's javadoc for the full operator checklist.
  #
  #   OPERATOR ACTION (per live partner — values from the environment, never literals):
  #     gateway.partner-credentials.partners[0].api-key      = ${ACME_API_KEY}      # pk_… from issuance
  #     gateway.partner-credentials.partners[0].partner-id   = <config-registry partner CODE>
  #     gateway.partner-credentials.partners[0].hmac-secret  = ${ACME_HMAC_SECRET}  # one-time sk_…
  #     gateway.partner-credentials.partners[0].ip-cidr-ranges = [...]
  partner-credentials:
    source: config
    partners: []
    # Require every presented key to be ACTIVE in auth-identity's credential store. Turning this
    # off means a key revoked upstream keeps working here; it is logged loudly at startup.
    verify-with-auth-identity: true

# HMAC signature verification settings
security:
  gateway:
    hmac:
      # Maximum permitted age of X-Timestamp in either direction (seconds).
      # Partners whose system clock drifts beyond this window will receive 401 EXPIRED_TIMESTAMP.
      clock-skew-seconds: 300

    # mTLS client-certificate fingerprint verification.
    # In production Nginx terminates mTLS and forwards the SHA-256 fingerprint of the verified
    # client certificate as the X-Client-Cert-Fingerprint header.  This filter checks that
    # fingerprint against the value stored in partner_mtls_cert.
    # Set enabled=true only in environments where the gateway sits behind an Nginx mTLS proxy.
    #
    # T0-7 / CISO#5 — HONEST STATE: still false by default, and that is NOT closed by this change.
    # When enabled, this filter trusts the X-Client-Cert-Fingerprint header, which is only
    # meaningful if a TLS-terminating proxy is provably the sole ingress path and strips the header
    # from client requests. No such proxy is defined anywhere in this repo (no Nginx config, no
    # ingress mTLS annotation, no NetworkPolicy), so enabling it here would create a spoofable
    # "mTLS enforced" signal — strictly worse than leaving it off and saying so. Enabling it is an
    # infrastructure task, not a config flip. HMAC + IP allowlist + the auth-identity lifecycle
    # check are the controls that actually run.
    mtls:
      enabled: false
      client-cert-header: X-Client-Cert-Fingerprint

    # IP-allowlist settings (Slice 8). T0-7: trust_header_only_in_dev and fail-open BOTH defaulted
    # to true, so (a) the unauthenticated X-Partner-Id header chose which partner's allowlist was
    # checked and (b) a config-registry outage admitted unchecked traffic. Both now default to the
    # safe value in PartnerIpAllowlistFilter and are pinned here; each is logged at startup if
    # switched back on.
    #
    # NOTE: the allowlist is read through ConfigRegistryClient, whose default implementation is an
    # in-memory stub that returns NOTHING (T0-7 — it used to seed a published test partner with
    # loopback/RFC1918 ranges). Set gmepay.config-registry.client=rest so the real partner
    # allowlist is consulted; otherwise every partner request is 403 IP_NOT_ALLOWED.
    allowlist:
      trust_header_only_in_dev: false
      default-environment: sandbox
      fail-open: false
      cache-ttl-seconds: 60
