spring:
  application:
    name: qr-service
  # NOTE: datasource / JPA / Flyway settings live in application.properties so the
  # H2-PostgreSQL-mode test default and SPRING_DATASOURCE_* prod overrides stay in
  # one place. Do not duplicate them here.

server:
  port: 8084

qr:
  zeropay:
    mai-tag: 26
    cpm-token-ttl-seconds: 60

# T0-2: `internal.api.token: changeme-internal-token` used to live here. It fed an
# `X-Internal-Token` header on RestPrefundingReservationClient that NOTHING on the platform reads —
# an invented scheme with a checked-in default literal, i.e. zero authentication that looked like
# some. It has been replaced by the real platform gate below; the key is deliberately not kept as an
# alias, so any stale reference fails loudly instead of silently sending a fake credential.

# Phase 2: prefunding reserve/release for OVERSEAS (outbound) CPM issuance (IR-qr-3).
# Disabled by default so unit/slice tests + no-prefunding runs use the in-memory fixture
# (InMemoryPrefundingReservationFixture). Set enabled=true + base-url in deployments where
# prefunding is reachable to wire the real RestPrefundingReservationClient.
gmepay:
  prefunding:
    reserve:
      enabled: false
    base-url: http://prefunding:8080
  # Service-to-service internal-auth token (com.gme.pay.internalauth, #90). OUTBOUND only for
  # qr-service: prefunding's whole balance API — including the CPM reserve/release this service
  # calls — is behind the gate, so the token must be presented on every call. NO default value: it
  # must come from the GMEPAY_INTERNAL_AUTH_SECRET environment variable. Blank ⇒ no header ⇒ a gated
  # prefunding refuses (401) and CPM issuance declines: fail-closed, never a bypass.
  internal-auth:
    secret: ${GMEPAY_INTERNAL_AUTH_SECRET:}

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
