# qr-service — persistence configuration (17.2-G04).
#
# Defaults to in-memory H2 in PostgreSQL-compat mode so unit/slice tests run without
# Docker. Production (and the Testcontainers PostgreSQL 16 ITs) override via
# SPRING_DATASOURCE_* / dynamic properties. This service owns the QR-parse result
# cache and merchant-resolution cache tables only.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:qrdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway owns the schema – Hibernate must not auto-DDL.
# No dialect is pinned: Hibernate 6 auto-detects (H2 locally, PostgreSQL in CI/prod),
# so the same migrations run unmodified on both engines.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---- scheduler pool (gap T3-11 defect 2) ----
# One @Scheduled job: CpmTokenExpiryScheduler (expiry sweep every 30s by default). Pool was unset,
# which is Spring's default of ONE thread.
#
# Same reasoning as merchant-qr-data: the starved party at pool=1 is not the job, it is lib-errors'
# SchedulerLagProbe heartbeat, which shares this pool and reports NO lag when it cannot get a thread —
# so the metric added to make a stalled sweep visible is the first thing a stall hides. That matters
# more here than the job count suggests: the sweep is what expires CPM tokens, so a sweep that quietly
# stopped leaves presented-mode tokens usable past their expiry. 2 = 1 job + the heartbeat.
spring.task.scheduling.pool.size=2
