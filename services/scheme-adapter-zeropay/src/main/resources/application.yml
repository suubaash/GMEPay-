spring:
  application:
    name: scheme-adapter-zeropay

server:
  port: 8090

management:
  server:
    port: 8091
  endpoint:
    health:
      show-details: always

adapter:
  zeropay:
    enabled: true
    scheme-id: ZEROPAY
    scheme-name: ZeroPay
    operator-name: KFTC
    payout-currency: KRW
    realtime-api-base-url: ""
    sftp-host: ""
    sftp-port: 22
    mai-tag: "29"
    institution-code: "GME001"
    # KST batch file scheduler — default OFF so it never fires without explicit opt-in
    batch-enabled: false
    # Batch record source: "persistence" (default) reads the in-service zp_committed_txns
    # table populated at commit time, producing non-empty ZP00xx files; "stub" falls back to
    # the empty-file ZpStubBatchDataPort.
    batch-data-source: persistence
    # Cross-service enrichment of batch records from transaction-management (IR-1 refund
    # amount/merchant/qrCode; IR-3 settlement value date). Default OFF so local/CI runs (where
    # transaction-management is not running) keep the in-process fallback (NoOpZpBatchEnrichmentPort).
    enrichment:
      enabled: false
      transaction-mgmt-base-url: http://localhost:8080

# ZeroPay scheme simulator + local-dir SFTP stub paths
gmepay:
  # ---- business-day calendar (GAP T3-4: "holidays ignored") ----
  # The six KST batch crons consult this before generating/transmitting anything. Ships EMPTY: there is no
  # Korean banking-holiday table here and no rule for deriving one (Seollal/Chuseok are lunar, substitute and
  # temporary holidays are gazetted annually), so a hardcoded table would be wrong for some year and believed
  # anyway. Firing a ZP00xx file on a KRW bank holiday risks KFTC rejecting it or double-counting it.
  #
  # POPULATING THIS IS AN OPERATOR / BUSINESS INPUT, not a code change. See
  # Documentation/RUNBOOK_BATCH_OPS.md.
  #
  # Property names match settlement-reconciliation exactly, so one set of values configures both services.
  # While empty, every date classifies UNVERIFIED: runs still PROCEED (fail-open), each is stamped
  # calendar_verdict=UNVERIFIED in zp_batch_runs, and the day's first run raises a BATCH_CALENDAR_UNVERIFIED
  # WARN ops alert — so the absence of calendar data is visible rather than silently equal to "always open".
  calendar:
    non-business-dates: ${GMEPAY_CALENDAR_NON_BUSINESS_DATES:}
    non-business-days-of-week: ${GMEPAY_CALENDAR_NON_BUSINESS_DAYS_OF_WEEK:}
    verified-through: ${GMEPAY_CALENDAR_VERIFIED_THROUGH:}
    fail-closed: ${GMEPAY_CALENDAR_FAIL_CLOSED:false}
  scheme:
    zeropay:
      # sim-scheme :9102 base URL; override with GMEPAY_SCHEME_ZEROPAY_BASE_URL in production
      base-url: http://localhost:9102/v1/scheme
  batch:
    # Local-dir SFTP stub paths — override in production with real SFTP config
    outbound-dir: ${java.io.tmpdir}/gmepay/outbound
    inbound-dir: ${java.io.tmpdir}/gmepay/inbound

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
