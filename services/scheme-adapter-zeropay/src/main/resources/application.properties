# scheme-adapter-zeropay — persistence configuration (batch file registry + ZP record staging).
#
# Defaults to in-memory H2 in PostgreSQL-compat mode so unit/slice tests run without
# Docker. Real-PostgreSQL coverage lives in the @Tag("docker") Testcontainers IT
# (ZpBatchPersistencePostgresIT), executed by the `integrationTest` task in CI.
# Production overrides via SPRING_DATASOURCE_* environment variables.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:zpadapterdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway owns the schema — Hibernate must not auto-DDL. No dialect is pinned:
# Hibernate auto-detects H2 vs PostgreSQL so one config serves both engines
# (no H2-only workarounds).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---- service-to-service internal-auth gate (T0-2) ----
# This adapter has NO public surface. Everything it exposes is server-to-server:
#   /internal/scheme/zeropay/{submit,cancel,cpm,balance-check,status,health}
#       — the OUTBOUND scheme calls. `submit`/`cpm` authorise and commit real money at KFTC and
#         `cancel` reverses it, so an anonymous caller here moves funds at the partner network.
#   /internal/scheme/zeropay/registration-status
#       — the settlement prerequisite gate settlement-reconciliation consults before it will
#         generate a ZP0061/ZP0063 settlement request.
#   /__data/**  — DevDataController, a raw dump of zp_committed_txns / zp_batch_files
#         (already @ConditionalOnProperty(gmepay.devtools.enabled), default off, but until now
#         completely unauthenticated whenever it WAS on).
# Before this gate every one of those answered any anonymous caller who could reach port 8090.
#
# The gate is the shared lib-errors mechanism (com.gme.pay.internalauth, #90) that already fronts
# auth-identity and prefunding: a caller must present the shared secret in the X-Gme-Internal header
# or the request is refused 401 before any controller runs. The trusted callers are
# payment-executor's RestSchemeClient and settlement-reconciliation's RestRegistrationStatusClient.
#
# enabled is pinned to true (see InternalAuthEnforcedConfig, which refuses to start if the gate is
# not actually installed), and the secret has NO default: an absent / blank
# GMEPAY_INTERNAL_AUTH_SECRET fails the service closed at startup rather than serving anonymous
# scheme submissions.
gmepay.internal-auth.enabled=true
gmepay.internal-auth.secret=${GMEPAY_INTERNAL_AUTH_SECRET:}
# Gated surfaces. /actuator/health/** and /actuator/info stay anonymous for container probes.
# NOTE: this service runs the actuator on a SEPARATE management port (application.yml
# management.server.port=8091), which is a child context — servlet filters registered here do not
# apply to it, so the /actuator pattern below only covers requests that arrive on the app port.
# Not exposing 8091 outside the cluster remains a deployment concern.
gmepay.internal-auth.path-patterns=/internal/**,/__data/**,/actuator/metrics/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
