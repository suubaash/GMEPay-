# Test profile for scheme-adapter-zeropay (activated with @ActiveProfiles("test")).
#
# T0-2: the adapter now refuses to boot unless the service-to-service internal-auth gate is armed
# with a non-blank secret (see com.gme.pay.scheme.zeropay.config.InternalAuthEnforcedConfig), so any
# test that starts the full application context has to supply one. This value is a TEST FIXTURE, not
# a credential: it lives in the test source set, is never packaged into the service jar, and must
# stay in sync with com.gme.pay.scheme.zeropay.testsupport.TestInternalAuth#SECRET.
gmepay.internal-auth.secret=test-fixture-internal-token-not-a-deployment-secret

# The KST batch scheduler and cross-service enrichment stay off (they already are by default);
# pinned here so a context started by a gate test never reaches out over the network.
adapter.zeropay.batch-enabled=false
adapter.zeropay.enrichment.enabled=false
