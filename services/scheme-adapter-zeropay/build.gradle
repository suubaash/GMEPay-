// scheme-adapter-zeropay: ACL adapter for ZeroPay (ZP00xx batch files, REST submission)
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Actuator (feat/actuator-health): /actuator/health + liveness/readiness probes + /actuator/metrics.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.flywaydb:flyway-core'
    implementation project(':libs:lib-money')
    implementation project(':libs:lib-errors')
    implementation project(':libs:lib-events')
    // T3-4: the ops.alert transport for batch-run failures. Without this the adapter's EventPublisher can
    // only ever be the log fallback, so a failed 02:00 ZP0011 could not reach the platform's alert pipeline
    // at all (the same first-hop break T3-3 found in payment-executor). The auto-config is inert unless
    // spring.kafka.bootstrap-servers is set, so local/CI boots stay broker-free and no OTHER event starts
    // being published — this adapter emits no domain events, only ops alerts.
    implementation project(':libs:lib-events-kafka')
    // Wave-3 reconcile: canonical /refunded read DTO (RefundedTransactionView) so the refund
    // enrichment consumer binds the producer's real field names instead of ad-hoc names → null.
    implementation project(':libs:lib-api-contracts')

    // T3-11: distributed scheduler locking. The six ZP00xx batch windows each GENERATE AND TRANSFER a
    // file to ZeroPay; on a second replica the scheme receives every file twice. Version matches
    // prefunding (5.16.0) -- see com.gme.pay.scheme.zeropay.config.ShedLockConfig.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.16.0'

    // Flyway 10.x ships PostgreSQL support as a separate module (needed by the
    // postgres:16 Testcontainers ITs and production); H2 support stays in flyway-core.
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'

    // Docker-backed integration tests: @Tag("docker") classes are excluded from the
    // local `test` task (no Docker on dev boxes) and run via `integrationTest` in CI.
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.1')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}
