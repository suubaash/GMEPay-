// scheme-adapter-sendmn: ACL adapter for the SendMN (Mongolia, QPay-fronted) QR scheme.
// Real-time REST (Authentication → VerifyQr → Confirm → PaymentStatus) plus a
// partner-hosted FX-rate registration endpoint that SendMN calls into us, so —
// unlike scheme-adapter-nepal — this adapter persists state (smn_fx_rates,
// smn_payments) and therefore carries JPA + Flyway.
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Actuator (feat/actuator-health): /actuator/health + liveness/readiness probes + /actuator/metrics.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.flywaydb:flyway-core'
    implementation project(':libs:lib-errors')

    // Flyway 10.x ships PostgreSQL support as a separate module (production);
    // H2 support stays in flyway-core (local unit slices).
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
}
