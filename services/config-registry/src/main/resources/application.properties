# config-registry service configuration.
#
# Default datasource: in-process H2 in PostgreSQL-compat mode for dev/test (no Docker required).
# Production overrides via SPRING_DATASOURCE_* env vars to point at the owned PostgreSQL
# instance (MSA rule 1: this service owns its DB; see INTER_SERVICE_CONTRACTS.md).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:configreg;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Schema is owned by Flyway, not Hibernate. The dialect is auto-detected from the
# datasource (H2 for local/unit slices, PostgreSQL in production and docker ITs) —
# do not pin it here (17.2-G01: no H2-mode workarounds).
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
# Engine-split migrations (Slice 6): db/migration holds the engine-neutral chain;
# db/vendor/{vendor} holds the few statements whose syntax PG and H2 cannot share.
# Spring Boot substitutes {vendor} from the datasource (h2 | postgresql). Today the
# split carries exactly one file — V004, whose generated column PG REQUIRES the
# STORED keyword for while H2 (2.2 and 2.3 alike) rejects it with a syntax error.
# The PostgreSQL variant is byte-identical to the pre-split V004, so the checksum
# recorded in every live PG flyway_schema_history remains valid. The vendor dir is
# deliberately OUTSIDE db/migration: Flyway scans locations recursively, and nesting
# the variants under db/migration would surface duplicate version-4 migrations.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

# Surface the human-readable reason on ResponseStatusException + ApiException so
# the BFF (and downstream UIs) can render meaningful error messages instead of
# Spring's default "{ timestamp, status, error, path }" stub.
server.error.include-message=always

# Redis config cache (17.3-G03): cache-aside on hot config GET paths with explicit
# DEL on writes. The cache beans are gated on spring.data.redis.host — when it is
# unset (local dev, unit slices) the cache is a no-op pass-through straight to the DB.
# Production sets SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT via the environment.
# Entry TTL for cached config values (staleness ceiling if an eviction is ever lost).
registry.cache.ttl=10m

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# Slice 3 (3A.1) — ADR-006 document vault. With gmepay.vault.endpoint UNSET the
# in-memory vault client is auto-wired (dev/unit-slice default: zero infra).
# Cloud-agnostic: the io.minio S3-API client (NOT a cloud SDK) works against any
# S3-compatible endpoint — self-hosted MinIO (on-prem default), AWS S3, or an
# Azure-via-S3 gateway — by varying only the env below:
#   GMEPAY_VAULT_ENDPOINT=http://minio:9000   (master switch; unset = in-memory)
#   GMEPAY_VAULT_REGION=us-east-1             (MinIO default; set bucket region for S3)
#   GMEPAY_VAULT_PATH_STYLE=true              (true=MinIO/path-style, false=AWS virtual-host)
#   GMEPAY_VAULT_ACCESS_KEY / GMEPAY_VAULT_SECRET_KEY (default to the compose dev creds)
# Bucket gmepay-partner-vault is auto-provisioned with versioning + object-lock
# COMPLIANCE retention (10y) by VaultBucketInitializer on first reachable boot.

# KYB document uploads (license/AoA scans). Spring Boot's default multipart cap
# is 1MB; 25MB is the platform's per-document ceiling (mirrored at the BFF).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# --- Credential-issuance collaborators (Slice 8 Lanes B + D; gap T1-1) -------------
# These two selectors decide whether partner ACTIVATION issues REAL credentials or dead
# local randomness, so they are declared here explicitly (rather than left to the
# @ConditionalOnProperty defaults) — a reader of this file must be able to see which
# transport a deployment gets without reading the client classes.
#
#   rest (DEFAULT) -> RestAuthIdentityClient  -> POST http://<auth-identity>/internal/auth/keys
#                     RestNotificationWebhookClient -> POST http://<notif>/v1/webhooks/endpoints
#   stub           -> StubAuthIdentityClient / StubNotificationWebhookClient: in-process
#                     random strings that NOTHING can verify. Opt-in only, logs a WARN at
#                     startup, and must never be set in an environment whose activation
#                     output reaches a real partner.
#
# History: until gap T1-1 the stubs were the implicit default and the `rest` selector was
# only ever set for ops-partner-bff — so every deployed config-registry handed operators
# fabricated go-live keys and a webhook secret notification-webhook had never seen.
gmepay.auth-identity.client=${GMEPAY_AUTH_IDENTITY_CLIENT:rest}
gmepay.auth-identity.base-url=${GMEPAY_AUTH_IDENTITY_BASE_URL:http://auth-identity:8080}
gmepay.notification-webhook.client=${GMEPAY_NOTIFICATION_WEBHOOK_CLIENT:rest}
gmepay.notification-webhook.base-url=${GMEPAY_NOTIFICATION_WEBHOOK_BASE_URL:http://notification-webhook:8080}

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---- dev surface: OFF by default, token-gated when on (T0-2) ----
# gmepay.devtools.enabled gates DevDataController (/__data/**), a read-only dump of EVERY table in
# this service's schema — the partner catalogue and its credential metadata (partner records,
# commercial terms, bank accounts, mTLS certs, IP allowlists, webhook subscriptions, API-key rows).
# It was already off by default but completely unauthenticated whenever it was on. When it is turned
# on, DevSurfaceInternalAuthConfig requires the shared internal-auth token on that path and the
# service REFUSES TO START without GMEPAY_INTERNAL_AUTH_SECRET.
gmepay.devtools.enabled=false

# ---- service-to-service internal-auth token (T0-2 / T0-5) ----
# The platform's shared internal token (com.gme.pay.internalauth, #90). Used here in BOTH directions:
#  - outbound: presented in the X-Gme-Internal header on every call to auth-identity
#    (/internal/auth/keys — RestAuthIdentityClient) and to prefunding
#    (PUT /internal/v1/prefunding/{id}/credit-limit — RestPrefundingCreditLimitClient); both of
#    those surfaces are now gated, so without this the T1-1 credential issuance and the credit-limit
#    push both 401;
#  - inbound: required on the /__data dev surface above when it is enabled, plus opportunistic
#    gating of /actuator/metrics and /v3/api-docs whenever a secret is configured.
# The operator surface (/v1/partners/**, /v1/schemes/**, ...) is authenticated at the api-gateway /
# ops BFF and is deliberately NOT gated here.
# NO default value: it must come from the GMEPAY_INTERNAL_AUTH_SECRET environment variable.
gmepay.internal-auth.secret=${GMEPAY_INTERNAL_AUTH_SECRET:}

# ---- audit actor attestation (T5-1) ----
# Who an audited write is attributed to. This service does NOT authenticate operators (see the
# note above: the operator surface is authenticated at the api-gateway / ops BFF), so it cannot
# validate a JWT subject itself. What it CAN verify is the CALLER: a request presenting the
# internal-auth secret above came from a trusted in-cluster service, and the ops BFF derives
# X-Actor from a JWT subject it verified itself. So an X-Actor claim on an internal-auth-verified
# request is recorded as an attested principal; without it the claim is recorded as
# `unverified:<claim>` (or `unattributed` when absent) and can never be mistaken for a real
# operator id. Nothing is ever recorded as the bare literal "system" any more — AuditActors
# refuses it, because it used to mean both "the platform acted" and "nobody told me who did".
#
# require-attestation=true makes an unattested write a 401 instead of an `unverified:` audit row.
# It is OFF by default because ops-partner-bff's RestConfigRegistryClient sends X-Actor but does
# NOT yet send X-Gme-Internal on the partner/scheme endpoints; turning this on before that client
# is updated would break every operator write. Flip it once the BFF presents the token — the
# outstanding count is queryable:
#   SELECT count(*) FROM audit_log WHERE actor_id LIKE 'unverified:%' OR actor_id = 'unattributed';
gmepay.audit.actor.require-attestation=${GMEPAY_AUDIT_REQUIRE_ATTESTATION:false}

# actor_ip: the transport peer address by default (the only value that is not client-supplied).
# X-Forwarded-For is honoured only from an attested caller AND only with this flag on — set it
# true when this service sits behind a proxy you control that appends the header. Leaving it false
# behind a proxy records the proxy's address, which is at least true; setting it true without a
# trusted proxy would record whatever a client typed, which is the bug this replaced.
gmepay.audit.actor.trust-forwarded-ip=${GMEPAY_AUDIT_TRUST_FORWARDED_IP:false}

# RestAuthIdentityClient reads its outbound token from a service-specific key that predates the
# shared one (docker-compose / Helm set GMEPAY_AUTH_IDENTITY_INTERNAL_SECRET for it). Declared here
# with a fallback chain so that setting the single platform variable GMEPAY_INTERNAL_AUTH_SECRET is
# now sufficient: without this, an environment that sets only the platform variable would send NO
# token to auth-identity and every T1-1 credential issuance would 401 against the (now
# enforced-by-default) auth-identity gate. The service-specific variable still wins where it is set.
gmepay.auth-identity.internal-secret=${GMEPAY_AUTH_IDENTITY_INTERNAL_SECRET:${GMEPAY_INTERNAL_AUTH_SECRET:}}
