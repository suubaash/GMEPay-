# Test-profile overrides. Additive to src/main/resources/application.properties (profile-specific
# files do NOT shadow it), and never packaged into the service jar — src/test/resources is test-only.
#
# T0-5: prefunding refuses to start without a service-to-service internal-auth secret (there is
# deliberately no default in main config, so a deployment that forgets GMEPAY_INTERNAL_AUTH_SECRET
# fails closed instead of serving the balance API anonymously). Tests therefore supply a fixture
# value here. It is NOT a credential for anything: no deployment reads this file, and the value is
# named so that finding it in a running environment is itself the bug report.
gmepay.internal-auth.secret=test-fixture-internal-token-not-a-deployment-secret
