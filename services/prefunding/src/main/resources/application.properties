# Datasource: defaults to in-memory H2 (PostgreSQL mode) so tests run without Docker.
# Production overrides come from the SPRING_DATASOURCE_* environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:prefunding;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway is the only schema manager; Hibernate must never DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# Slice 5 (5B.1) — tier alerting + breach auto-suspend.
# Outbox drain interval for the gmepay.prefunding.alert events (OutboxPublisher).
gmepay.outbox.poll-ms=1000
# Breach hook: the in-memory StubConfigRegistryClient is the default so the service
# (and its tests) boot standalone. Set gmepay.config-registry.client=rest in deployment
# to POST real system change_requests (status=SUSPENDED, proposed_by='system', ADR-008).
gmepay.config-registry.base-url=http://config-registry:8080

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---- service-to-service internal-auth gate (T0-5 / CISO#6) ----
# EVERY endpoint this service exposes either moves partner float (deduct / credit / reverse /
# reserve / capture / release / cumulative-charge / credit-limit / provision) or reads it
# (balance / alerts / deductions). None of it is a customer- or partner-facing surface: the only
# legitimate callers are other GMEPay+ services (payment-executor, qr-service, config-registry,
# ops-partner-bff). Until this gate, anyone with network reach to port 8080 could debit or credit
# any partner's balance with an unauthenticated POST.
#
# The gate is the shared lib-errors mechanism (com.gme.pay.internalauth, #90) already fronting
# auth-identity's /internal/**: a caller must present the shared secret in the X-Gme-Internal
# header or the request is refused 401 before any controller runs.
#
# enabled is pinned to true (NOT env-overridable to false in any meaningful way — see
# InternalAuthEnforcedConfig, which refuses to start if the gate is not actually installed), and
# the secret has NO default: an absent / blank GMEPAY_INTERNAL_AUTH_SECRET fails the service
# closed at startup rather than serving money-moving endpoints to anonymous callers.
gmepay.internal-auth.enabled=true
gmepay.internal-auth.secret=${GMEPAY_INTERNAL_AUTH_SECRET:}
# Gated surfaces. /actuator/health/** and /actuator/info stay anonymous for container probes;
# /actuator/metrics, /v3/api-docs and /swagger-ui (which publish the internal API shape and
# per-partner counters) are gated with everything else.
# T3-2: /actuator/prometheus is listed next to /actuator/metrics/** because the scrape endpoint became
# REAL this iteration (Micrometer registry on every deployable + exposed fleet-wide by
# com.gme.pay.platform.MetricsExposureEnvironmentPostProcessor). Same sensitivity as /actuator/metrics,
# so the same gate: a scraper must present X-Gme-Internal. See Documentation/RUNBOOK_MONITORING.md.
gmepay.internal-auth.path-patterns=/internal/**,/v1/prefunding/**,/actuator/metrics/**,/actuator/prometheus,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# ---- AML monitoring (gap T5-3) ----
# prefunding holds cumulative_usage_ledger (V006), the platform's only append-only record of
# per-partner transaction VOLUME and VELOCITY. Until T5-3 it was reachable in exactly one shape:
# the single-period sums the authorize path compares against a cap, under a row lock, on the hot
# path. Nobody could ask it the question monitoring and investigation actually ask — "what did this
# partner do, day by day, over this period" — without a direct database session.
#
# GET /internal/v1/prefunding/{partnerId}/aml-monitoring?from=yyyy-MM-dd&to=yyyy-MM-dd now answers
# it (both bounds inclusive, KST day keys; already behind the /internal/** auth gate above). That
# endpoint serves EVIDENCE. It is not an AML control, and the partner caps it returns are reported
# as context, not applied as rules.
#
# Largest span a single evidence read may cover, in KST days. This is a RESOURCE bound, not a
# policy one: it keeps an unbounded date range from turning a read of an append-only ledger into a
# full-table scan. 366 = one leap year, the longest look-back a regulator-facing read plausibly
# needs in one call. Longer periods are read as consecutive windows.
gmepay.aml.monitoring.max-window-days=366
#
# ---------------------------------------------------------------------------------------------
# THE RULE LIST BELOW IS EMPTY. THAT IS DELIBERATE, AND IT HAS A CONSEQUENCE.
# ---------------------------------------------------------------------------------------------
# A monitoring threshold — any figure, over any window — is a COMPLIANCE POLICY INPUT. It encodes
# GME's risk appetite, its licence conditions, its regulator's expectations and its customer base.
# No engineer on this repository is in a position to invent one. A plausible-looking default
# committed here would end up in a control inventory, a due-diligence questionnaire and an audit
# as evidence that GMEPay+ monitors for structuring — when it would in fact be a number somebody
# made up. So there is no starter set, no commented-out example with real figures, and no
# "reasonable" fallback in code.
#
# The consequence, stated plainly so it is not discovered later:
#
#     WHILE gmepay.aml.monitoring.rules IS EMPTY, PREFUNDING RAISES NO AML MONITORING ALERTS.
#
# AmlMonitoringEvaluator short-circuits on an empty list: no outbox event, no audit row, no I/O.
# The evidence endpoint still works — evidence is useful with or without rules — but nothing is
# being watched automatically, and no document may claim otherwise until compliance populates this.
#
# Populating it is a compliance decision. Each rule needs a name, a metric, and a threshold:
#
#   gmepay.aml.monitoring.rules[0].name=<name compliance chose>
#   gmepay.aml.monitoring.rules[0].metric=<WINDOW_NET_USD|WINDOW_NET_TXN_COUNT
#                                          |MAX_DAILY_NET_USD|MAX_DAILY_NET_TXN_COUNT>
#   gmepay.aml.monitoring.rules[0].threshold=<figure compliance chose>
#   gmepay.aml.monitoring.rules[0].window-days=<trailing days; omit for the whole read window>
#
# A rule fires when the metric is STRICTLY GREATER THAN the threshold (equality passes, matching
# the cumulative-cap boundary on the authorize path). A malformed rule — blank name, missing
# metric, missing or negative threshold, duplicate name — FAILS THE SERVICE AT STARTUP rather than
# being skipped: a rule that is configured and silently does nothing is worse than no rule, because
# somebody believes it is running.
#
# De-duplication of repeated alerts for the same (partner, rule, window) is IN-MEMORY and per
# instance — it does not survive a restart and is not shared across replicas. See the
# AmlMonitoringEvaluator javadoc; it is not durable and is not claimed to be.

# ---- T3-11 defect 2: @Scheduled thread pool ------------------------------------------------------
# `spring.task.scheduling.pool.size` defaults to ONE thread. prefunding runs one job on it — the
# outbox publisher, at a 1-SECOND fixedDelay (gmepay.outbox.poll-ms) — plus the scheduler-lag
# heartbeat that lib-errors' SchedulerLagProbe registers on this same pool.
#
# One job does not sound like a starvation risk, and for the job it is not. The victim is the MONITOR:
# on a single thread the 1-second poller and the heartbeat compete, and a probe that cannot get a
# thread reports NO LAG. That is the worst possible reading, because "the pool is fine" and "the pool
# is so busy the probe never ran" are indistinguishable — the metric added to make §4.1 #5 visible
# would itself be the thing hidden. Sized to 2 so the measurement is independent of the thing measured.
#
# Two threads is also what keeps this honest as the service grows: SchedulerPoolSizeTest pins
# pool.size > job count, so a second @Scheduled job added here fails the build instead of quietly
# sharing a thread with a 1-second poller.
spring.task.scheduling.pool.size=2
