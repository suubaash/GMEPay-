spring.application.name=notification-webhook
server.port=8085

# ---------------------------------------------------------------------------
# Phase-1 persistence: H2 by default so tests / local dev need no Docker.
# Production overrides via env vars (PostgreSQL).
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:notify;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# Kafka (17.4-G04): intentionally NO local default for bootstrap servers.
# The payment.approved consumer (WebhookKafkaConsumerConfig) and the
# lib-events-kafka publisher both activate only when
# spring.kafka.bootstrap-servers is set — docker-compose injects
# SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092 via standard relaxed binding.
# Without it the service runs broker-free (unit slices, local dev).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Webhook delivery dispatcher (WBS 8.6). The @Scheduled drain in WebhookDispatcher
# is DISABLED by default so H2-only unit slices / local dev never attempt outbound
# delivery. Enable with GMEPAY_WEBHOOK_DISPATCHER_ENABLED=true alongside a reachable
# endpoint registration and a resolvable signing secret.
# ---------------------------------------------------------------------------
gmepay.webhook.dispatcher.enabled=${GMEPAY_WEBHOOK_DISPATCHER_ENABLED:false}
# 5000, not 30000. T3-11 shortened the cycle in the @Scheduled default and this line still shipped
# 30000, which OVERRODE it — the deployed drain was still on a 30 s cycle, so the claimed change was
# not in effect anywhere. With fixedDelay the interval is dead time AFTER a drain returns, and on a
# queue that never closes that was 30 s of every cycle spent not delivering. Pinned by
# WebhookEndpointFairnessTest so the two cannot diverge again.
gmepay.webhook.dispatcher.interval-ms=${GMEPAY_WEBHOOK_DISPATCHER_INTERVAL_MS:5000}
gmepay.webhook.dispatcher.initial-delay-ms=${GMEPAY_WEBHOOK_DISPATCHER_INITIAL_DELAY_MS:5000}

# ---------------------------------------------------------------------------
# Per-endpoint fairness (T3-11 defect 5 — the design half concurrency did not fix).
#
# The drain used to select the globally-oldest PENDING rows across ALL partners and deliver them
# through one shared worker pool. A partner whose endpoint was down therefore both filled the batch
# (so healthy partners' rows were never selected) and occupied the workers (so those that were
# selected waited behind it). Raising concurrency 1 -> 8 raised the number of simultaneously-stalled
# deliveries needed to stall everyone from 1 to 8; it did not decouple partners.
#
# fair-selection: ask each endpoint WITH WORK for an equal share of batch-size and interleave the
# shares round-robin. false restores the old global FIFO — an escape hatch, not a recommendation.
gmepay.webhook.dispatcher.fair-selection=${GMEPAY_WEBHOOK_DISPATCHER_FAIR_SELECTION:true}
# max-in-flight-per-endpoint: 0 = derive the fair share ceil(concurrency / endpoints-with-work), which
# is the right default because a CONSTANT would throttle a single-partner deployment from 8 workers to
# the constant, for the benefit of partners that do not exist. Set a positive value only to pin it.
gmepay.webhook.dispatcher.max-in-flight-per-endpoint=${GMEPAY_WEBHOOK_DISPATCHER_MAX_IN_FLIGHT_PER_ENDPOINT:0}
#
# Circuit breaker: after N consecutive failed deliveries an endpoint's rows are SKIPPED for
# open-duration, then one half-open probe is allowed. A skipped row is not a failed attempt, so an
# outage does not burn the ten-attempt retry budget — which makes webhook_dlq promotion slower for a
# dead endpoint, not impossible (the probes still advance rows). Opening raises a P2
# WEBHOOK_ENDPOINT_CIRCUIT_OPEN alert_event row, deduped per partner, because silently not delivering
# to one partner would just be a different invisible failure.
#
# BOTH NUMBERS ARE ENGINEERING DEFAULTS, NOT COMMITMENTS TO ANY PARTNER. 5 failures is above the noise
# of a single transient 5xx (and the code floors it at 2); 1 minute is short enough that a partner
# restarting is barely delayed and long enough that 200 queued rows do not each re-test a dead socket.
# An owner should confirm both against partner expectations for delivery latency during an incident.
gmepay.webhook.dispatcher.breaker.enabled=${GMEPAY_WEBHOOK_DISPATCHER_BREAKER_ENABLED:true}
gmepay.webhook.dispatcher.breaker.failure-threshold=${GMEPAY_WEBHOOK_DISPATCHER_BREAKER_FAILURE_THRESHOLD:5}
gmepay.webhook.dispatcher.breaker.open-duration=${GMEPAY_WEBHOOK_DISPATCHER_BREAKER_OPEN_DURATION:PT1M}

# Outbound HTTP transport: 'rest' (default, RestWebhookHttpClient). Any other value
# suppresses the bean (tests mock WebhookHttpClient directly).
gmepay.webhook.http-client=${GMEPAY_WEBHOOK_HTTP_CLIENT:rest}

# Endpoint environment to deliver to (V004 roster: SANDBOX | LIVE).
gmepay.webhook.environment=${GMEPAY_WEBHOOK_ENVIRONMENT:LIVE}

# ---------------------------------------------------------------------------
# Webhook signing ROOT KEY (gap T5-4). MEANING CHANGED: this is no longer the HMAC
# key that signs every partner's webhooks — it is the HKDF derivation root from which
# each endpoint's OWN secret is derived (WebhookSecretDeriver:
# HKDF-SHA256(root, info=partner|environment|generation)). It is never disclosed to
# any partner; what a partner receives is their derived whsec_ secret, revealed once
# at registration / rotation.
#
# The webhook_endpoint row still stores only the SHA-256 digest of that secret, and the
# dispatcher checks its re-derived value against that digest before signing — so a
# blank or WRONG root key produces no delivery (rows stay PENDING) instead of a wrong
# or shared signature. Required in every environment that must deliver webhooks.
# ---------------------------------------------------------------------------
gmepay.webhook.signing-secret=${GMEPAY_WEBHOOK_SIGNING_SECRET:}

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Service-to-service internal-auth gate over the endpoint PROVISIONING surface (T5-8).
#
# /v1/webhooks/endpoints/** is machine-to-machine only: config-registry registers an
# endpoint at partner activation, and the ops BFF rotates a secret / reads signing health.
# It mints and reveals whsec_ plaintext, so it must never be reachable by anything else —
# yet nothing fronts this service and there was no gate here at all.
#
# DEFAULT OFF, so this change is behaviour-neutral today: turning it on requires
# GMEPAY_INTERNAL_AUTH_SECRET to be present on this service in docker-compose.yml and
# deploy/helm/gmepay/values*.yaml (it is NOT today — see the T5-8 report's deploy asks).
# Both callers already send the X-Gme-Internal header when their own secret is configured
# (config-registry's RestNotificationWebhookClient, the BFF's RestWebhookOpsClient), so
# arming the gate is a pure deployment change. InternalAuthAutoConfiguration fails the
# service closed if enabled=true arrives without a secret — it can never silently no-op.
# ---------------------------------------------------------------------------
gmepay.internal-auth.enabled=${GMEPAY_INTERNAL_AUTH_ENABLED:false}
gmepay.internal-auth.secret=${GMEPAY_INTERNAL_AUTH_SECRET:}
gmepay.internal-auth.path-patterns=/v1/webhooks/endpoints,/v1/webhooks/endpoints/**

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# ---- T3-11: @Scheduled thread pool ---------------------------------------------------------------
# `spring.task.scheduling.pool.size` was set in NO file anywhere in this repo, so Spring's default of
# ONE thread applied to every service. notification-webhook stacks TWO plus the lag heartbeat: the webhook dispatcher drain and the backlog monitor.
#
# One thread means these jobs do not merely run late under load — they run in strict sequence, so a
# slow job blocks its siblings entirely. Those two are pathologically badly paired on one thread: the drain is the job that blocks for minutes on unresponsive partner endpoints, and the backlog monitor is the job whose entire purpose is to alert that the drain is not keeping up. On one thread the monitor cannot fire precisely when it has something to say.
#
# Sized to the job count so no job can be starved by a sibling. This is not a throughput lever: these
# are latency-insensitive background jobs and 3 threads at ~1 MB of stack each is a rounding
# error against the heap. It is a correctness lever, because the starved jobs are the safety nets.
#
# The starvation was also SILENT: no scheduler-lag metric existed. lib-errors now registers one
# automatically (gmepay.scheduler.lag / .lag.max / .pool.size / .active / .queued) on every service
# with @EnableScheduling — see com.gme.pay.metrics.SchedulerLagProbe.
spring.task.scheduling.pool.size=3
