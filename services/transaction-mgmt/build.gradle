// transaction-mgmt service: owns the transaction store, state machine, and outbox.
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Actuator (feat/actuator-health): /actuator/health + liveness/readiness probes + /actuator/metrics.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // NOTE: spring-boot-starter-data-redis was here for a Redis-backed idempotency store that was
    // auto-selected whenever spring.data.redis.host was set -- which the Helm ABI ConfigMap does
    // for every pod, so this service used a non-durable cache for its duplicate-money-transaction
    // control without anyone choosing that. The store is now the module's own idempotency_keys
    // table (V013), so the dependency is gone: it would otherwise also re-add a Redis health
    // indicator that could mark this service unready over infrastructure it does not use.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.flywaydb:flyway-core'
    // ShedLock: distributed lock so a @Scheduled method fires on at most one replica per tick
    // (the sweepers + outbox drain must not double-fire across horizontally-scaled instances).
    // JDBC-template provider reuses the service's existing DataSource; no extra infra.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.13.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.13.0'
    implementation project(':libs:lib-money')
    implementation project(':libs:lib-errors')
    implementation project(':libs:lib-events')
    // Phase-2: canonical committed-FX projection + event payload contracts.
    implementation project(':libs:lib-api-contracts')
    // Kafka transport for the outbox drain (17.4-G02). Auto-config registers a
    // @Primary KafkaEventPublisher only when spring.kafka.bootstrap-servers is set.
    implementation project(':libs:lib-events-kafka')

    runtimeOnly 'org.postgresql:postgresql'
    // Flyway 10 ships PostgreSQL support as a separate artifact; required when the
    // migrations run against real PostgreSQL (docker-tagged ITs / production).
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    // H2 (PostgreSQL mode) backs the no-Docker unit slices only.
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // KafkaTemplate/DefaultKafkaProducerFactory + kafka-clients consumer for the
    // docker-tagged outbox→Kafka IT (version managed by the Boot BOM).
    testImplementation 'org.springframework.kafka:spring-kafka'

    // Docker-backed ITs (@Tag("docker"), run via :integrationTest in CI only — this
    // machine has no Docker; locally these classes compile but are skipped by tag).
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.1')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
}
