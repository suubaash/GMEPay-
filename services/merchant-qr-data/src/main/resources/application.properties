# merchant-qr-data — persistence wiring (WBS 9.3 / 17.7-G01, ADR-003: MongoDB).
#
# Default: spring.data.mongodb.uri is NOT set, all Mongo auto-configuration is
# excluded, and the in-memory MerchantRepository serves lookups. Unit tests and
# local development therefore need no Mongo daemon.
#
# To enable the MongoDB-backed store, provide SPRING_DATA_MONGODB_URI (e.g.
# mongodb://host:27017/merchant). MongoPersistenceConfig is gated on that
# property and wires the Mongo client, template, Spring Data repositories and
# the unique qrCode index; MongoBackedMerchantRepository then becomes @Primary.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---- scheduler pool (gap T3-11 defect 2) ----
# One @Scheduled job: MerchantSyncScheduler (nightly merchant sync, cron 0 0 2 * * *). Pool was unset,
# which is Spring's default of ONE thread.
#
# One job is not a starvation risk for the job. The victim is the MONITOR: lib-errors'
# SchedulerLagProbe registers its heartbeat on this same pool, so on a single thread the sync — which
# makes outbound calls and can hold its thread for the whole read budget — and the probe compete, and a
# probe that cannot get a thread reports NO lag. "The pool is fine" and "the pool is too busy to
# measure" must not be indistinguishable, which is exactly what pool=1 makes them. 2 = 1 job + the
# heartbeat, enforced fleet-wide by SchedulerPoolSizeWiringGuardTest.
spring.task.scheduling.pool.size=2
