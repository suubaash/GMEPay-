spring:
  application:
    name: auth-identity
  # Default datasource: in-process H2 in PostgreSQL-compat mode for dev/test.
  # Production sets SPRING_DATASOURCE_* env vars to point at the owned PostgreSQL
  # instance (MSA rule 1: this service owns its DB).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:authid;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by Flyway, not Hibernate
  flyway:
    enabled: true

server:
  port: 8085

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

gme:
  auth:
    jwt:
      # HS256 signing key for the platform capability tokens this service mints at
      # /internal/auth/token/issue. WHOEVER HOLDS THIS KEY CAN FORGE ANY TOKEN.
      #
      # T0-6: this used to default to the literal `changeme-at-least-32-chars-long!!`, which was
      # (a) checked into the repo, (b) set in NO deployment file anywhere, and (c) deliberately
      # sized to pass the 32-char HS256 length check — so a deployment that forgot the env var
      # booted cleanly and signed valid tokens with a published key. There is now NO default:
      # an absent/blank/too-short/known-published value makes the service REFUSE TO START
      # (JwtSigningKeyEnforcedConfig), the same fail-closed posture as the internal-auth gate.
      #
      #   OPERATOR ACTION:  GME_AUTH_JWT_SIGNING_SECRET=<random 32+ chars>   (e.g. openssl rand -hex 32)
      #
      # This is the ACTIVE key: the one that signs. Its `kid` is derived from the value itself
      # (JwtKeySet#kidFor) and stamped into every token header, so it is never configured by hand
      # and can never point at the wrong secret.
      signing-secret: ${GME_AUTH_JWT_SIGNING_SECRET:}
      # ── Rotation: previously active keys, accepted for VERIFICATION ONLY (T0-6) ──
      # Format:  <secret>@<ISO-8601 instant it stopped signing>   entries separated by `;`
      #   GME_AUTH_JWT_PREVIOUS_KEYS="oldsecret@2026-07-28T09:00:00Z"
      # Each entry must clear exactly the same bar as the active key (>= 32 bytes, not
      # placeholder-shaped, never a value published in this repo) — an accepted key is live signing
      # material for as long as it is accepted. The timestamp is mandatory: it is what determines
      # when the key becomes safe to delete (demoted-at + max-token-ttl-seconds).
      # Empty is the correct steady state; entries exist only during a rotation window.
      # Runbook: docs/runbooks/JWT_KEY_ROTATION.md
      previous-keys: ${GME_AUTH_JWT_PREVIOUS_KEYS:}
      # When the ACTIVE key started signing. Set by the rotation runbook. If it is within one
      # max-token-ttl-seconds of now and previous-keys is EMPTY, the service refuses to start:
      # that combination means the outgoing key was dropped in the same step the new one was
      # promoted, which silently invalidates every live token.
      active-key-activated-at: ${GME_AUTH_JWT_ACTIVE_KEY_ACTIVATED_AT:}
      # Declares that losing every live token is intended. Legitimate in exactly two situations:
      # a first deployment (there is no outgoing key), and a response to a suspected key compromise
      # (invalidating live tokens is the whole point). Never a way to skip a failing startup check.
      allow-hard-cutover: ${GME_AUTH_JWT_ALLOW_HARD_CUTOVER:false}
      # Access token lifetime: 30 minutes (1800 s).
      access-token-ttl-seconds: ${GME_AUTH_JWT_ACCESS_TOKEN_TTL_SECONDS:1800}
      # Hard upper bound on a per-request TTL override at /internal/auth/token/issue.
      # A caller may request a shorter token but never one longer than this (1 h).
      max-token-ttl-seconds: ${GME_AUTH_JWT_MAX_TOKEN_TTL_SECONDS:3600}
  config-registry:
    # Base URL of the config-registry service. Production injects this via env var.
    base-url: ${GME_CONFIG_REGISTRY_BASE_URL:http://config-registry:8080}

# Service-to-service internal-auth gate (#90, hardened under T0-2). auth-identity has NO public
# surface: every controller it ships is internal-only —
#   /internal/auth/token/**  JWT MINTING (a token here makes the bearer anyone)
#   /internal/auth/keys/**   partner API-key + webhook-secret ISSUANCE and rotation (T1-1)
#   /internal/auth/verify    HMAC signature verification
#   /v1/rbac/**              RBAC resolution + catalogue management
#   /v1/approvals/**         approval decisions (which trust an X-Gme-Permissions header)
# — all reached server-to-server by the api-gateway claim resolver, the ops BFF and config-registry,
# NOT through the gateway's strip/stamp filter. Without a gate any actor with network reach could
# mint a JWT, issue itself a partner API key, enumerate/mutate the authority matrix, or forge an
# approval. A request to those paths must carry the shared X-Gme-Internal token.
#
# T0-2: `enabled` used to be ${GMEPAY_INTERNAL_AUTH_ENABLED:false} — i.e. an unconfigured deploy (a
# bare `bootRun`, a hand-rolled compose, a new environment that forgot the env var) served JWT
# minting and API-key issuance ANONYMOUSLY. With the shared auto-configuration "flag absent" and
# "flag false" both mean *no filter at all*, so the safe default has to be ON. It is now pinned true
# and no longer env-overridable in any meaningful way: InternalAuthEnforcedConfig refuses to start
# when the gate is not genuinely armed (see that class). The secret has NO default — an absent or
# blank GMEPAY_INTERNAL_AUTH_SECRET fails the service closed at startup rather than issuing
# credentials to anonymous callers.
#
# NOTE: this gate asserts "a trusted internal service is calling" — operator-level authority
# (rbac.manage) is enforced upstream.
gmepay:
  internal-auth:
    enabled: true
    secret: ${GMEPAY_INTERNAL_AUTH_SECRET:}
    # Explicit rather than relying on InternalAuthProperties' defaults, so a change to the shared
    # default can never silently un-gate this service. /actuator/health/** and /actuator/info stay
    # anonymous for container probes; /actuator/metrics, /v3/api-docs and Swagger UI (which publish
    # the credential-issuance API shape) are gated with everything else.
    #
    # Written as a comma-delimited scalar, NOT a YAML block sequence: a sequence binds to indexed
    # keys (path-patterns[0], [1], ...) which InternalAuthEnforcedConfig's @Value cannot read, so the
    # fail-closed assertion would reject a correct configuration. Spring binds this scalar to the
    # List<String> on InternalAuthProperties just the same.
    path-patterns: /internal/**,/v1/rbac/**,/v1/approvals/**,/actuator/metrics/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

logging:
  level:
    com.gme.pay.auth: INFO

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
