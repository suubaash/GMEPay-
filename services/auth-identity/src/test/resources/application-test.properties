# Test profile for auth-identity (activated with @ActiveProfiles("test")).
#
# T0-2: the service now refuses to boot unless the service-to-service internal-auth gate is armed
# with a non-blank secret (see com.gme.pay.auth.config.InternalAuthEnforcedConfig), so any test that
# starts the full application context has to supply one. This value is a TEST FIXTURE, not a
# credential: it lives in the test source set, is never packaged into the service jar, and must stay
# in sync with com.gme.pay.auth.testsupport.TestInternalAuth#SECRET.
gmepay.internal-auth.secret=test-fixture-internal-token-not-a-deployment-secret

# Keep the outbox / scheduled work quiet in tests; the gate is what these contexts exercise.
spring.main.banner-mode=off
