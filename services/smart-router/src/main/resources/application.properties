spring.application.name=smart-router

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# ---- scheme operating hours (gap T3-6) ----
# V024's header says the router needs scheme_operating_hours to decide "can this transaction route NOW?".
# LocationSchemeResolver now has that branch: a scheme whose seeded window (evaluated in the ROW's own
# IANA timezone, never the server's) excludes the current scheme-local time is dropped from the candidate
# list, and when EVERY candidate is closed the resolution fails with the canonical SCHEME_CLOSED (409,
# non-retryable). Three verdicts, never two: a scheme with no usable row for the current scheme-local
# weekday is UNVERIFIED and is KEPT as a candidate (logged at WARN) — four of the nine rostered schemes
# have no seeded rows, so refusing on UNVERIFIED would take live corridors offline over missing reference
# data. Nothing reads "no row" as "open".
#
# The schedule is read from config-registry only when gmepay.config-registry.enabled=true (the same gate
# as the partner-scheme registry); otherwise UnverifiedSchemeOperatingHoursSource is active and logs an
# ERROR banner at startup so the absence of the control is visible rather than silent. Rows are
# migration-seeded reference data, so they are cached per scheme (default 10 minutes).
# gmepay.scheme-hours.cache-ttl-millis=600000

# ---- outbound HTTP budgets (gap T3-11 defect 1) ----
# All three of this service's outbound clients read config-registry ON THE RESOLVE PATH — a payment is
# in flight while they run — and all three used to build from the STATIC RestClient.builder() factory,
# which bypasses every RestClientCustomizer in the context. They therefore had NO read timeout at all
# while gmepay.http.client.read-timeout below resolved and appeared in /actuator/env as though it
# applied. An unresponsive config-registry held the routing thread until the OS closed the socket.
#
# 500ms/500ms, matching payment-executor's twin of the same hop (gmepay.scheme-hours.*): these are
# in-cluster reference-data reads and every one of them has a declared failure mapping — the registry
# and the resolver answer SCHEME_UNAVAILABLE (503, retryable), the operating-hours source degrades to
# UNVERIFIED and keeps the candidate. Resolution runs BEFORE any irreversible submit, so failing it
# fast is safe: nothing has been sent to a scheme yet, so there is nothing to double-send (ADR-016 §4
# does not apply to a pre-submit read, and ResolvePathTimeoutTest asserts that).
gmepay.config-registry.connect-timeout-millis=500
gmepay.config-registry.read-timeout-millis=500

# The fleet floor (lib-errors HttpClientTimeoutAutoConfiguration) tightened from its 10s default to 5s
# for this service, so any FUTURE outbound client added here is bounded inside payment-executor's 5s
# internal budget (gmepay.internal-http.read-timeout-millis) rather than outliving the payment that is
# waiting on the resolve. Asserted by OutboundBudgetNestingTest.
gmepay.http.client.connect-timeout=2s
gmepay.http.client.read-timeout=5s

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
