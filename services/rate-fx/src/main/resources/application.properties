spring.application.name=rate-fx

# Persistence — defaults to in-memory H2 in PostgreSQL-compat mode so unit slices run
# without Docker. Production overrides via SPRING_DATASOURCE_* environment variables
# (PostgreSQL 16). The real-PG contract is verified by the @Tag("docker") Testcontainers
# ITs (run via the root `integrationTest` task on CI; this machine has no Docker).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ratefxdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway owns the schema — Hibernate must not auto-DDL.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Quote TTL (rate lock) in seconds. The lock lives in the QuoteTtlStore:
# Redis-backed (key rq:{quoteId}, EXPIRE = this TTL) when spring.data.redis.host is
# set — e.g. SPRING_DATA_REDIS_HOST=redis — otherwise an in-memory fallback is used.
rate.quote.ttl-seconds=900

# Springdoc (Swagger UI + /v3/api-docs). See OpenApiConfig.java for the bean.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# XE live-rate integration (audit gap B4 / UC-05-01).
# Point base-url at sim-rate-provider (simulators/sim-rate-provider, port 9101) for dev/test.
# Set enabled=true + override base-url in production to use the real xe.com endpoint.
#gmepay.rate-fx.xe.enabled=false
#gmepay.rate-fx.xe.base-url=http://localhost:9101
#gmepay.rate-fx.xe.fetch-delay-ms=900000

# Actuator (feat/actuator-health): health + liveness/readiness probes + metrics on the app port.
# Only health/info/metrics exposed; env/beans/heapdump/shutdown stay off. show-details=never
# so no internals leak (no auth wiring assumed in the sandbox).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---- service-to-service internal-auth gate (T0-2) ----
# POST /v1/rates/snapshots (RateSnapshotAdminController) appends an effective-dated treasury-rate
# snapshot, and the latest snapshot WINS at resolution time — so writing one re-prices every
# subsequent quote and payment in that currency. Its own javadoc said the path "is intended to sit
# behind the internal-auth gate (operator-only)"; it was not, and the api-gateway does not front it
# either (the gateway route is the EXACT path /v1/rates, not /v1/rates/**), so the only protection
# was that nobody had noticed the path.
#
# Gated with the shared lib-errors mechanism (com.gme.pay.internalauth, #90). The PUBLIC partner
# surface — POST /v1/rates (stateless calculator) and /v1/quotes/** — is deliberately NOT gated: it
# is authenticated at the api-gateway and gating it here would break partner traffic.
#
# enabled is pinned to true (see InternalAuthEnforcedConfig, which refuses to start if the gate is
# not actually installed), and the secret has NO default: an absent / blank
# GMEPAY_INTERNAL_AUTH_SECRET fails the service closed at startup rather than accepting anonymous
# rate overrides.
gmepay.internal-auth.enabled=true
gmepay.internal-auth.secret=${GMEPAY_INTERNAL_AUTH_SECRET:}
# Both forms of the snapshot path (AntPathMatcher's /** also matches the bare path, listed
# explicitly so a reader does not have to know that). /actuator/health/** and /actuator/info stay
# anonymous for container probes; /actuator/metrics and the api-docs are gated.
# T3-2: /actuator/prometheus is listed next to /actuator/metrics/** because the scrape endpoint became
# REAL this iteration (Micrometer registry on every deployable + exposed fleet-wide by
# com.gme.pay.platform.MetricsExposureEnvironmentPostProcessor). Same sensitivity as /actuator/metrics,
# so the same gate: a scraper must present X-Gme-Internal. See Documentation/RUNBOOK_MONITORING.md.
# T5-1: /internal/** is ADDED (never replacing anything above) for the read-only audit-chain
# integrity report (AuditIntegrityController). That report enumerates every currency GME prices and
# every operator who has touched a rate, so it is at least as disclosive as the snapshot write it
# audits and belongs behind the same gate.
gmepay.internal-auth.path-patterns=/v1/rates/snapshots,/v1/rates/snapshots/**,/internal/**,/actuator/metrics/**,/actuator/prometheus,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# ---- T3-11 defect 2: @Scheduled thread pool ------------------------------------------------------
# `spring.task.scheduling.pool.size` defaults to ONE thread. rate-fx runs one job on it —
# XeRateFetchScheduler, at a 15-minute fixedDelay — plus the scheduler-lag heartbeat that lib-errors'
# SchedulerLagProbe registers on this same pool.
#
# The reason this is not left at 1: the fetch job makes an OUTBOUND call to an external rate provider.
# It is now bounded (T3-11 defect 1 — XeRateClient takes the injected RestClient.Builder, so
# gmepay.http.client.read-timeout applies where before there was no read timeout at all), but bounded
# still means it can hold its thread for the whole read budget. On a single thread that budget is also
# the window in which the scheduler-lag heartbeat cannot run, so the one metric that would report a
# stalled rate fetch goes quiet exactly while the fetch is stalling. Sized to 2 so the measurement is
# independent of the thing measured.
spring.task.scheduling.pool.size=2
