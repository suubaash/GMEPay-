server.port=9105
spring.application.name=sim-gmeremit

# Base URL of the payment-executor hub (POST /v1/pay)
gmepay.sim.gmeremit.gmepay-base-url=http://localhost:8084

# Base URL of the Nepal QR partner sim (sim-nepal-qr), used to decode Fonepay/NepalPay QRs.
# Cross-border payments (GMERemit user "in Nepal") decode here via POST /qrscan-thirdparty/parse/.
gmepay.sim.nepal-qr.base-url=http://localhost:9103

# Mock cross-border FX (KRW debited per 1 NPR). Production FX is sourced from rate-fx; this is a
# sim-only rate so the wallet can show a KRW-debit estimate for Nepal payments.
gmepay.sim.fx.krw-per-npr=1.05
# Small FX margin added on top of the mid rate (0.02 = 2%), mirroring sim-wallet's SENDMN corridor.
gmepay.sim.fx.npr-margin=0.02

# Directory for JSONL persistence (wallet balances + transaction history survive restart).
gmepay.sim.gmeremit.data-dir=data/sim-gmeremit

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.com.gme.sim=DEBUG
