server:
  port: 9102

spring:
  application:
    name: sim-scheme
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

gmepay:
  sim:
    scheme:
      profile: ZEROPAY   # KHQR | ZEROPAY
      data-dir: data/sim-scheme   # JSONL persistence dir (merchants/payments/feed survive restart)

logging:
  level:
    com.gme.sim: DEBUG
